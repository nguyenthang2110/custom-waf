<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAF Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-dot {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .5;
            }
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1f2937;
            border-radius: 0.5rem;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
    </style>
</head>

<body class="bg-gray-900 text-white">
    <div id="app"></div>

    <!-- Log Details Modal -->
    <div id="logModal" class="modal-overlay" onclick="if(event.target === this) dashboard.closeLogModal()">
        <div class="modal-content border border-gray-700">
            <div class="flex justify-between items-center p-6 border-b border-gray-700 bg-gray-800 rounded-t-lg">
                <h3 class="text-xl font-bold text-white">Request Details</h3>
                <button onclick="dashboard.closeLogModal()" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="p-6 space-y-6" id="logModalContent">
                <!-- Content injected via JS -->
            </div>
            <div class="p-6 border-t border-gray-700 bg-gray-800 rounded-b-lg flex justify-end">
                <button onclick="dashboard.closeLogModal()"
                    class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm font-semibold">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Authentication check
        const checkAuth = () => {
            const token = localStorage.getItem('waf_token');
            if (!token) {
                window.location.href = '/login.html';
                return false;
            }
            return true;
        };

        // Logout function
        const logout = () => {
            localStorage.removeItem('waf_token');
            localStorage.removeItem('waf_user');
            window.location.href = '/login.html';
        };

        // Check auth before loading dashboard
        if (!checkAuth()) {
            throw new Error('Not authenticated');
        }

        const API_BASE = '/waf-api';

        class WAFDashboard {
            constructor() {
                this.currentTab = 'logs';
                this.logs = [];
                this.logsMetadata = { total: 0, page: 1, per_page: 50, total_pages: 1 };
                this.logsSortBy = 'timestamp';
                this.logsSortOrder = 'desc';
                this.logsFilters = {
                    decision: '',
                    ip: '',
                    method: '',
                    path: ''
                };
                this.stats = {};
                this.ips = [];
                this.whitelist = [];
                this.blacklist = [];
                this.uploadNotification = null;
                this.selectedFile = null;
                this.backendURL = 'Loading...';
                this.wafConfig = null;
                this.refreshInterval = null;
                this.init();
            }

            async init() {
                await this.loadData();
                await this.loadBackend();
                await this.loadWAFConfig();
                this.render();
                this.startAutoRefresh();
            }

            async loadData() {
                try {
                    // Load stats
                    const statsRes = await fetch(`${API_BASE}/stats`);
                    this.stats = await statsRes.json();

                    // Load logs with current filters/pagination
                    await this.loadLogsWithFilters();

                    // Load IPs
                    const ipsRes = await fetch(`${API_BASE}/ips`);
                    this.ips = await ipsRes.json();

                    // Load whitelist / blacklist
                    const wlRes = await fetch(`${API_BASE}/whitelist`);
                    const blRes = await fetch(`${API_BASE}/blacklist`);
                    this.whitelist = (await wlRes.json()).ips || [];
                    this.blacklist = (await blRes.json()).ips || [];
                } catch (error) {
                    console.error('Failed to load data:', error);
                }
            }

            async loadLogsWithFilters() {
                try {
                    // Build query string
                    const params = new URLSearchParams();
                    params.append('page', this.logsMetadata.page);
                    params.append('per_page', this.logsMetadata.per_page);
                    params.append('sort_by', this.logsSortBy);
                    params.append('sort_order', this.logsSortOrder);

                    if (this.logsFilters.decision) params.append('decision', this.logsFilters.decision);
                    if (this.logsFilters.ip) params.append('ip', this.logsFilters.ip);
                    if (this.logsFilters.method) params.append('method', this.logsFilters.method);
                    if (this.logsFilters.path) params.append('path_contains', this.logsFilters.path);

                    const response = await fetch(`${API_BASE}/logs?${params}`);
                    const data = await response.json();

                    this.logs = data.logs || [];
                    this.logsMetadata = data.metadata || { total: 0, page: 1, per_page: 50, total_pages: 1 };
                } catch (error) {
                    console.error('Failed to load logs:', error);
                    this.logs = [];
                }
            }

            async loadBackend() {
                try {
                    const response = await fetch(`${API_BASE}/backend`);
                    const data = await response.json();
                    this.backendURL = data.backend || 'Unknown';
                } catch (error) {
                    console.error('Failed to load backend:', error);
                    this.backendURL = 'Error loading';
                }
            }

            startAutoRefresh() {
                this.refreshInterval = setInterval(() => {
                    // Don't refresh if user is typing
                    const activeElement = document.activeElement;
                    const isTyping = activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA' || activeElement.tagName === 'SELECT');

                    if (!isTyping) {
                        this.loadData().then(() => this.render());
                    } else {
                        // Just load data silently without re-rendering to keep stats fresh in background?
                        // Or simpler: just skip this cycle
                        console.log('Skipping refresh while typing...');
                    }
                }, 5000); // Refresh every 5 seconds
            }

            stopAutoRefresh() {
                if (this.refreshInterval) {
                    clearInterval(this.refreshInterval);
                }
            }

            async manualRefresh() {
                await this.loadData();
                this.render();
            }

            render() {
                const app = document.getElementById('app');
                app.innerHTML = `
                    ${this.renderHeader()}
                    ${this.renderNavigation()}
                    <div class="max-w-7xl mx-auto px-6 py-6">
                        ${this.renderContent()}
                    </div>
                `;
                this.attachEventListeners();
            }

            renderHeader() {
                return `
                    <header class="bg-gray-800 border-b border-gray-700">
                        <div class="max-w-7xl mx-auto px-6 py-4">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                                    </svg>
                                    <div>
                                        <h1 class="text-2xl font-bold">WAF Dashboard</h1>
                                        <p class="text-sm text-gray-400">Real-time Security Monitoring</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-4">
                                    <button onclick="dashboard.manualRefresh()" class="flex items-center gap-2 px-4 py-2 bg-cyan-600 hover:bg-cyan-700 rounded-lg transition">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                        </svg>
                                        Refresh
                                    </button>
                                    <div class="flex items-center gap-2 px-3 py-2 bg-green-900 rounded-lg">
                                        <div class="w-2 h-2 bg-green-400 rounded-full status-dot"></div>
                                        <span class="text-sm">Online</span>
                                    </div>
                                    <div class="flex items-center gap-3 px-3 py-2 bg-gray-700 rounded-lg">
                                        <span class="text-sm" id="userInfo">👤 ${JSON.parse(localStorage.getItem('waf_user') || '{"username":"User"}').username}</span>
                                        <button onclick="logout()" class="text-red-400 hover:text-red-300 text-sm font-semibold">Logout</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>
                `;
            }

            renderNavigation() {
                const tabs = [
                    { id: 'logs', label: 'Live Logs' },
                    { id: 'ips', label: 'IP Addresses' },
                    { id: 'stats', label: 'Statistics' },
                    { id: 'access', label: 'Access Control' },
                    { id: 'rules', label: 'Rules Management' },
                    { id: 'config', label: 'Configuration' }
                ];

                return `
                    <nav class="bg-gray-800 border-b border-gray-700">
                        <div class="max-w-7xl mx-auto px-6">
                            <div class="flex gap-1">
                                ${tabs.map(tab => `
                                    <button onclick="dashboard.switchTab('${tab.id}')" 
                                            class="px-6 py-3 font-medium transition ${this.currentTab === tab.id
                        ? 'text-cyan-400 border-b-2 border-cyan-400 bg-gray-700'
                        : 'text-gray-400 hover:text-gray-200'
                    }">
                                        ${tab.label}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </nav>
                `;
            }

            renderContent() {
                switch (this.currentTab) {
                    case 'logs':
                        return this.renderLogs();
                    case 'ips':
                        return this.renderIPs();
                    case 'stats':
                        return this.renderStats();
                    case 'access':
                        return this.renderAccessControl();
                    case 'rules':
                        return this.renderRulesManagement();
                    case 'config':
                        return this.renderConfiguration();
                    default:
                        return '';
                }
            }

            renderLogs() {
                const sortIcon = (column) => {
                    if (this.logsSortBy !== column) return '↕';
                    return this.logsSortOrder === 'asc' ? '↑' : '↓';
                };

                return `
                    <div class="space-y-4">
                        <div class="bg-gray-800 rounded-lg border border-gray-700 p-6">
                            <!-- Header with Clear Logs -->
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="text-xl font-bold">Live Logs</h3>
                                <button onclick="dashboard.clearAllLogs()" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded text-sm font-semibold">
                                    Clear All Logs
                                </button>
                            </div>

                            <!-- Filters -->
                            <form onsubmit="dashboard.applyLogsFilters(event)" class="mb-4">
                                <div class="grid grid-cols-5 gap-3">
                                    <select onchange="dashboard.logsFilters.decision = this.value" class="px-3 py-2 rounded bg-gray-700 border border-gray-600 text-sm">
                                        <option value="">All Decisions</option>
                                        <option value="ALLOW" ${this.logsFilters.decision === 'ALLOW' ? 'selected' : ''}>ALLOW</option>
                                        <option value="BLOCK" ${this.logsFilters.decision === 'BLOCK' ? 'selected' : ''}>BLOCK</option>
                                        <option value="CHALLENGE" ${this.logsFilters.decision === 'CHALLENGE' ? 'selected' : ''}>CHALLENGE</option>
                                    </select>
                                    <input type="text" placeholder="Filter by IP" value="${this.logsFilters.ip}" oninput="dashboard.logsFilters.ip = this.value" class="px-3 py-2 rounded bg-gray-700 border border-gray-600 text-sm">
                                    <select onchange="dashboard.logsFilters.method = this.value" class="px-3 py-2 rounded bg-gray-700 border border-gray-600 text-sm">
                                        <option value="">All Methods</option>
                                        <option value="GET" ${this.logsFilters.method === 'GET' ? 'selected' : ''}>GET</option>
                                        <option value="POST" ${this.logsFilters.method === 'POST' ? 'selected' : ''}>POST</option>
                                        <option value="PUT" ${this.logsFilters.method === 'PUT' ? 'selected' : ''}>PUT</option>
                                        <option value="DELETE" ${this.logsFilters.method === 'DELETE' ? 'selected' : ''}>DELETE</option>
                                    </select>
                                    <input type="text" placeholder="Filter by Path" value="${this.logsFilters.path}" oninput="dashboard.logsFilters.path = this.value" class="px-3 py-2 rounded bg-gray-700 border border-gray-600 text-sm">
                                    <div class="flex gap-2">
                                        <button type="submit" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-700 rounded text-sm font-semibold">Apply</button>
                                        <button type="button" onclick="dashboard.clearLogsFilters()" class="px-4 py-2 bg-gray-600 hover:bg-gray-700 rounded text-sm">Clear</button>
                                    </div>
                                </div>
                            </form>

                            <!-- Results info -->
                            <div class="mb-2 text-sm text-gray-400">
                                Showing ${this.logs.length === 0 ? 0 : (this.logsMetadata.page - 1) * this.logsMetadata.per_page + 1}-${Math.min(this.logsMetadata.page * this.logsMetadata.per_page, this.logsMetadata.total)} of ${this.logsMetadata.total} logs
                            </div>

                            <!-- Table -->
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm">
                                    <thead class="bg-gray-700">
                                        <tr>
                                            <th class="px-4 py-3 text-left cursor-pointer hover:bg-gray-600" onclick="dashboard.sortLogsBy('timestamp')">Time ${sortIcon('timestamp')}</th>
                                            <th class="px-4 py-3 text-left cursor-pointer hover:bg-gray-600" onclick="dashboard.sortLogsBy('client_ip')">Client IP ${sortIcon('client_ip')}</th>
                                            <th class="px-4 py-3 text-left cursor-pointer hover:bg-gray-600" onclick="dashboard.sortLogsBy('method')">Method ${sortIcon('method')}</th>
                                            <th class="px-4 py-3 text-left cursor-pointer hover:bg-gray-600" onclick="dashboard.sortLogsBy('path')">Path ${sortIcon('path')}</th>
                                            <th class="px-4 py-3 text-left cursor-pointer hover:bg-gray-600" onclick="dashboard.sortLogsBy('decision')">Decision ${sortIcon('decision')}</th>
                                            <th class="px-4 py-3 text-left cursor-pointer hover:bg-gray-600" onclick="dashboard.sortLogsBy('total_score')">Score ${sortIcon('total_score')}</th>
                                            <th class="px-4 py-3 text-left">Rules</th>
                                            <th class="px-4 py-3 text-left cursor-pointer hover:bg-gray-600" onclick="dashboard.sortLogsBy('latency_ms')">Latency ${sortIcon('latency_ms')}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${this.logs.length === 0 ? `
                                            <tr>
                                                <td colspan="8" class="px-4 py-8 text-center text-gray-400">
                                                    No logs found. ${this.logsFilters.decision || this.logsFilters.ip || this.logsFilters.method || this.logsFilters.path ? 'Try different filters.' : 'Waiting for requests...'}
                                                </td>
                                            </tr>
                                        ` : this.logs.map(log => `
                                            <tr class="border-t border-gray-700 hover:bg-gray-700 cursor-pointer transition-colors" onclick="dashboard.showLogDetails('${log.request_id}')">
                                                <td class="px-4 py-3">${this.formatTime(log.timestamp)}</td>
                                                <td class="px-4 py-3 font-mono text-xs">${log.client_ip}</td>
                                                <td class="px-4 py-3">
                                                    <span class="px-2 py-1 bg-gray-600 rounded text-xs">${log.method}</span>
                                                </td>
                                                <td class="px-4 py-3 text-xs max-w-xs truncate" title="${log.path}">${log.path}</td>
                                                <td class="px-4 py-3">${this.renderDecisionBadge(log.decision)}</td>
                                                <td class="px-4 py-3">
                                                    <span class="font-mono ${log.total_score > 10 ? 'text-red-400' : log.total_score > 5 ? 'text-yellow-400' : 'text-gray-400'}">
                                                        ${log.total_score.toFixed(1)}
                                                    </span>
                                                </td>
                                                <td class="px-4 py-3">
                                                    ${log.matched_rules && log.matched_rules.length > 0
                        ? `<span class="text-xs text-gray-400">${log.matched_rules.length} rules</span>`
                        : '-'}
                                                </td>
                                                <td class="px-4 py-3 text-xs">${log.latency_ms.toFixed(1)}ms</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>

                            <!-- Pagination -->
                            <div class="flex items-center justify-between mt-4 pt-4 border-t border-gray-700">
                                <button onclick="dashboard.previousLogsPage()" ${this.logsMetadata.page <= 1 ? 'disabled' : ''} class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm font-semibold disabled:opacity-50 disabled:cursor-not-allowed">
                                    ◀ Previous
                                </button>
                                <span class="text-sm text-gray-400">
                                    Page ${this.logsMetadata.page} of ${this.logsMetadata.total_pages}
                                </span>
                                <button onclick="dashboard.nextLogsPage()" ${this.logsMetadata.page >= this.logsMetadata.total_pages ? 'disabled' : ''} class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm font-semibold disabled:opacity-50 disabled:cursor-not-allowed">
                                    Next ▶
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderIPs() {
                return `
                    <div class="space-y-4">
                        <div class="bg-gray-800 rounded-lg border border-gray-700 p-6">
                            <h3 class="text-xl font-bold mb-4">IP Addresses</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm">
                                    <thead class="bg-gray-700">
                                        <tr>
                                            <th class="px-4 py-3 text-left">IP Address</th>
                                            <th class="px-4 py-3 text-left">Total Requests</th>
                                            <th class="px-4 py-3 text-left">Blocked</th>
                                            <th class="px-4 py-3 text-left">Status</th>
                                            <th class="px-4 py-3 text-left">Suspicion</th>
                                            <th class="px-4 py-3 text-left">Attacks</th>
                                            <th class="px-4 py-3 text-left">Last Seen</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${this.ips.length === 0 ? `
                                            <tr>
                                                <td colspan="7" class="px-4 py-8 text-center text-gray-400">
                                                    No IP data yet
                                                </td>
                                            </tr>
                                        ` : this.ips.map(ip => `
                                            <tr class="border-t border-gray-700 hover:bg-gray-700">
                                                <td class="px-4 py-3 font-mono text-xs">${ip.ip}</td>
                                                <td class="px-4 py-3">${ip.total_requests}</td>
                                                <td class="px-4 py-3">
                                                    <span class="${ip.blocked_requests > 0 ? 'text-red-400' : 'text-gray-400'}">
                                                        ${ip.blocked_requests}
                                                    </span>
                                                </td>
                                                <td class="px-4 py-3">
                                                    ${ip.is_blocked
                        ? '<span class="px-2 py-1 bg-red-900 text-red-300 rounded text-xs">BLOCKED</span>'
                        : ip.blocked_requests > 0
                            ? '<span class="px-2 py-1 bg-orange-900 text-orange-300 rounded text-xs">WARNING</span>'
                            : ip.is_suspicious
                                ? '<span class="px-2 py-1 bg-yellow-900 text-yellow-300 rounded text-xs">SUSPICIOUS</span>'
                                : '<span class="px-2 py-1 bg-green-900 text-green-300 rounded text-xs">NORMAL</span>'
                    }
                                                </td>
                                                <td class="px-4 py-3">
                                                    <span class="font-mono ${ip.suspicion_score > 0.7 ? 'text-red-400' : ip.suspicion_score > 0.3 ? 'text-yellow-400' : 'text-gray-400'}">
                                                        ${(ip.suspicion_score * 100).toFixed(0)}%
                                                    </span>
                                                </td>
                                                <td class="px-4 py-3 text-xs">
                                                    ${ip.detected_attacks && ip.detected_attacks.length > 0
                        ? ip.detected_attacks.join(', ')
                        : '-'}
                                                </td>
                                                <td class="px-4 py-3 text-xs">${this.formatTime(ip.last_seen)}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderStats() {
                return `
                    <div class="space-y-6">
                        <div class="grid md:grid-cols-4 gap-4">
                            ${this.renderStatCard('Total Requests', this.stats.total_requests || 0, 'blue')}
                            ${this.renderStatCard('Blocked', this.stats.total_blocked || 0, 'red', `${(this.stats.block_rate || 0).toFixed(2)}%`)}
                            ${this.renderStatCard('Allowed', this.stats.total_allowed || 0, 'green')}
                            ${this.renderStatCard('Avg Latency', this.stats.avg_latency || '0s', 'yellow')}
                        </div>

                        <div class="grid md:grid-cols-2 gap-6">
                            <div class="bg-gray-800 rounded-lg border border-gray-700 p-6">
                                <h3 class="text-lg font-bold mb-4">Top Rules</h3>
                                <div class="space-y-2">
                                    ${this.stats.top_rules && this.stats.top_rules.length > 0
                        ? this.stats.top_rules.slice(0, 5).map(rule => `
                                            <div class="flex justify-between items-center p-3 bg-gray-700 rounded">
                                                <span class="font-mono text-sm">${rule.rule_id}</span>
                                                <span class="text-cyan-400 font-bold">${rule.count}</span>
                                            </div>
                                        `).join('')
                        : '<p class="text-gray-400">No rule matches yet</p>'
                    }
                                </div>
                            </div>

                            <div class="bg-gray-800 rounded-lg border border-gray-700 p-6">
                                <h3 class="text-lg font-bold mb-4">System Info</h3>
                                <div class="space-y-3">
                                    <div class="flex justify-between">
                                        <span class="text-gray-400">Rules Loaded:</span>
                                        <span class="font-bold">${this.stats.rules_loaded || 0}</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="text-gray-400">Unique Clients:</span>
                                        <span class="font-bold">${this.stats.unique_clients || 0}</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="text-gray-400">Uptime:</span>
                                        <span class="font-bold">${this.stats.uptime || '0s'}</span>
                                    </div>
                                    <div class="flex justify-between">
                                        <span class="text-gray-400">Block Rate:</span>
                                        <span class="font-bold ${(this.stats.block_rate || 0) > 10 ? 'text-red-400' : 'text-green-400'}">
                                            ${(this.stats.block_rate || 0).toFixed(2)}%
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderAccessControl() {
                return `
                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="bg-gray-800 rounded-lg border border-gray-700 p-6">
                            <div class="flex items-center justify-between mb-4">
                                <div>
                                    <h3 class="text-xl font-bold">Whitelist</h3>
                                </div>
                            </div>
                            <form class="flex gap-3 mb-4" onsubmit="dashboard.submitWhitelist(event)">

            renderStatCard(label, value, color, subtext = '') {
                const colors = {
                    blue: 'bg-blue-900 border-blue-700 text-blue-300',
                    red: 'bg-red-900 border-red-700 text-red-300',
                    green: 'bg-green-900 border-green-700 text-green-300',
                    yellow: 'bg-yellow-900 border-yellow-700 text-yellow-300'
                };

                return `
                    <div class="bg-gray-800 rounded-lg border ${colors[color]} p-6">
                        <div class="text-sm text-gray-400 mb-2">${label}</div>
                        <div class="text-3xl font-bold">${value}</div>
                        ${subtext ? `<div class="text-sm mt-1">${subtext}</div>` : ''}
                    </div>
                `;
            }

            renderDecisionBadge(decision) {
                const badges = {
                    'BLOCK': '<span class="px-2 py-1 bg-red-900 text-red-300 rounded text-xs font-bold">BLOCK</span>',
                    'ALLOW': '<span class="px-2 py-1 bg-green-900 text-green-300 rounded text-xs font-bold">ALLOW</span>',
                    'CHALLENGE': '<span class="px-2 py-1 bg-yellow-900 text-yellow-300 rounded text-xs font-bold">CHALLENGE</span>',
                    'LOG': '<span class="px-2 py-1 bg-blue-900 text-blue-300 rounded text-xs font-bold">LOG</span>'
                };
                return badges[decision] || decision;
            }

            formatTime(timestamp) {
                const date = new Date(timestamp);
                return date.toLocaleTimeString();
            }

            switchTab(tab) {
                this.currentTab = tab;
                this.uploadNotification = null;
                this.render();
            }

            async submitWhitelist(event) {
                event.preventDefault();
                const ip = event.target.ip.value.trim();
                if (!ip) return;
                await this.addWhitelist(ip);
                event.target.reset();
            }

            async submitBlacklist(event) {
                event.preventDefault();
                const ip = event.target.ip.value.trim();
                if (!ip) return;
                await this.addBlacklist(ip);
                event.target.reset();
            }

            async addWhitelist(ip) {
                await fetch(`${API_BASE}/whitelist`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip })
                });
                await this.manualRefresh();
            }

            async removeWhitelist(ip) {
                await fetch(`${API_BASE}/whitelist`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip })
                });
                await this.manualRefresh();
            }

            async addBlacklist(ip) {
                await fetch(`${API_BASE}/blacklist`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip })
                });
                await this.manualRefresh();
            }

            async removeBlacklist(ip) {
                await fetch(`${API_BASE}/blacklist`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip })
                });
                await this.manualRefresh();
            }

            async clearAllLogs() {
                if (!confirm('Are you sure you want to clear all logs? This cannot be undone.')) {
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/logs/clear`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });

                    if (response.ok) {
                        await this.loadLogsWithFilters();
                        this.render();
                        this.showPopupNotification('success', 'Success', 'All logs cleared successfully!', null);
                    } else {
                        throw new Error('Failed to clear logs');
                    }
                } catch (error) {
                    console.error('Failed to clear logs:', error);
                    this.showPopupNotification('error', 'Error', 'Failed to clear logs: ' + error.message, null);
                }
            }

            async sortLogsBy(column) {
                if (this.logsSortBy === column) {
                    // Toggle order if same column
                    this.logsSortOrder = this.logsSortOrder === 'asc' ? 'desc' : 'asc';
                } else {
                    // New column, default to descending
                    this.logsSortBy = column;
                    this.logsSortOrder = 'desc';
                }

                await this.loadLogsWithFilters();
                this.render();
            }

            async applyLogsFilters(event) {
                if (event) event.preventDefault();

                // Reset to page 1 when applying new filters
                this.logsMetadata.page = 1;

                await this.loadLogsWithFilters();
                this.render();
            }

            async clearLogsFilters() {
                this.logsFilters = {
                    decision: '',
                    ip: '',
                    method: '',
                    path: ''
                };
                this.logsMetadata.page = 1;

                await this.loadLogsWithFilters();
                this.render();
            }

            async nextLogsPage() {
                if (this.logsMetadata.page < this.logsMetadata.total_pages) {
                    this.logsMetadata.page++;
                    await this.loadLogsWithFilters();
                    this.render();
                }
            }

            async previousLogsPage() {
                if (this.logsMetadata.page > 1) {
                    this.logsMetadata.page--;
                    await this.loadLogsWithFilters();
                    this.render();
                }
            }


            handleFileSelect(event) {
                const file = event.target.files[0];
                if (!file) return;

                // Clear notification
                this.uploadNotification = null;

                // Validate file
                if (!file.name.endsWith('.json')) {
                    this.selectedFile = null;
                    this.uploadNotification = `
                        <div class="p-4 bg-red-900 border border-red-700 rounded-lg text-red-200">
                            <strong>Error:</strong> File must be a JSON file
                        </div>
                    `;
                    this.render();
                    return;
                }

                // Store selected file
                this.selectedFile = file;
                this.render();
            }

            async uploadRulesFile() {
                if (!this.selectedFile) return;

                // Show loading in state
                this.uploadNotification = `
                    <div class="p-4 bg-blue-900 border border-blue-700 rounded-lg text-blue-200">
                        <div class="flex items-center gap-3">
                            <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span>Uploading and validating rules...</span>
                        </div>
                    </div>
                `;
                this.render();

                try {
                    const formData = new FormData();
                    formData.append('rules', this.selectedFile);

                    const response = await fetch(`${API_BASE}/rules/upload`, {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();

                    if (result.success) {
                        // Show popup notification
                        this.showPopupNotification(
                            'success',
                            'Upload Successful!',
                            `Successfully loaded ${result.rules_loaded} rules. ${result.backup_path ? 'Previous rules backed up.' : ''}`,
                            result.rules_loaded
                        );

                        // Clear uploaded notification in upload section
                        this.uploadNotification = null;
                        this.selectedFile = null;

                        // Refresh stats to update rule count
                        await this.loadData();
                        this.render();

                        // Clear file input
                        const fileInput = document.getElementById('ruleFileInput');
                        if (fileInput) fileInput.value = '';
                    } else {
                        this.uploadNotification = `
                            <div class="p-4 bg-red-900 border border-red-700 rounded-lg text-red-200">
                                <div class="flex items-start gap-3">
                                    <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    <div>
                                        <p class="font-semibold mb-1">Upload Failed</p>
                                        <p>${result.message}</p>
                                        ${result.errors && result.errors.length > 0 ? `
                                            <ul class="text-sm mt-2 list-disc list-inside">
                                                ${result.errors.map(err => `<li>${err}</li>`).join('')}
                                            </ul>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                        this.render();
                    }
                } catch (error) {
                    this.uploadNotification = `
                        <div class="p-4 bg-red-900 border border-red-700 rounded-lg text-red-200">
                            <p class="font-semibold mb-1">Error</p>
                            <p>Failed to upload file: ${error.message}</p>
                        </div>
                    `;
                    this.render();
                }
            }

            showPopupNotification(type, title, message, ruleCount) {
                // Create popup element
                const popup = document.createElement('div');
                popup.className = 'fixed top-4 right-4 z-50 animate-slide-in';
                popup.style.animation = 'slideIn 0.3s ease-out';

                const bgColor = type === 'success' ? 'bg-green-600' : 'bg-red-600';
                const icon = type === 'success' ? `
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                ` : `
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                `;

                popup.innerHTML = `
                    <div class="${bgColor} text-white rounded-lg shadow-2xl p-6 max-w-md">
                        <div class="flex items-start gap-4">
                            <div class="flex-shrink-0">
                                ${icon}
                            </div>
                            <div class="flex-1">
                                <h3 class="text-lg font-bold mb-1">${title}</h3>
                                <p class="text-sm opacity-90">${message}</p>
                                ${ruleCount ? `
                                    <div class="mt-3 pt-3 border-t border-white/20">
                                        <div class="flex items-center justify-between">
                                            <span class="text-sm">Total Rules Loaded:</span>
                                            <span class="text-2xl font-bold">${ruleCount}</span>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                            <button onclick="this.parentElement.parentElement.remove()" class="flex-shrink-0 text-white/80 hover:text-white">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                    </div>
                `;

                // Add animation styles
                const style = document.createElement('style');
                if (!document.getElementById('popup-animation-styles')) {
                    style.id = 'popup-animation-styles';
                    style.textContent = `
                        @keyframes slideIn {
                            from {
                                transform: translateX(100%);
                                opacity: 0;
                            }
                            to {
                                transform: translateX(0);
                                opacity: 1;
                            }
                        }
                        @keyframes slideOut {
                            from {
                                transform: translateX(0);
                                opacity: 1;
                            }
                            to {
                                transform: translateX(100%);
                                opacity: 0;
                            }
                        }
                    `;
                    document.head.appendChild(style);
                }

                // Add to body
                document.body.appendChild(popup);

                // Auto remove after 5 seconds
                setTimeout(() => {
                    popup.style.animation = 'slideOut 0.3s ease-in';
                    setTimeout(() => popup.remove(), 300);
                }, 5000);
            }


            async loadWAFConfig() {
                try {
                    const response = await fetch(`${API_BASE}/config`);
                    const data = await response.json();
                    this.wafConfig = data;
                } catch (error) {
                    console.error('Failed to load WAF config:', error);
                    this.wafConfig = null;
                }
            }

            async updateWAFConfig(event) {
                event.preventDefault();
                const formData = new FormData(event.target);

                const config = {
                    decision: {
                        block_threshold: parseFloat(formData.get('block_threshold')),
                        challenge_threshold: parseFloat(formData.get('challenge_threshold'))
                    },
                    rate_limit: {
                        requests_per_min: parseInt(formData.get('requests_per_min')),
                        burst_size: parseInt(formData.get('burst_size')),
                        endpoint_limits: this.wafConfig.rate_limit.endpoint_limits || {}
                    }
                };

                // Validate
                if (config.decision.challenge_threshold >= config.decision.block_threshold) {
                    this.showPopupNotification(
                        'error',
                        'Invalid Configuration',
                        'Challenge threshold must be less than block threshold',
                        null
                    );
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/config`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config)
                    });

                    const result = await response.json();

                    if (result.success) {
                        this.wafConfig = result.config;
                        this.showPopupNotification(
                            'success',
                            'Configuration Updated!',
                            `Block: ${config.decision.block_threshold}, Challenge: ${config.decision.challenge_threshold}, RPM: ${config.rate_limit.requests_per_min}`,
                            null
                        );
                        this.render();
                    } else {
                        this.showPopupNotification(
                            'error',
                            'Update Failed',
                            result.message || 'Failed to update configuration',
                            null
                        );
                    }
                } catch (error) {
                    this.showPopupNotification(
                        'error',
                        'Error',
                        `Failed to update configuration: ${error.message}`,
                        null
                    );
                }
            }

            async addEndpointLimit(event) {
                event.preventDefault();
                const path = event.target.path.value.trim();
                const rpm = parseInt(event.target.rpm.value);
                const burst = parseInt(event.target.burst.value);

                if (!path || !rpm || !burst) return;

                // Update local config
                if (!this.wafConfig.rate_limit.endpoint_limits) {
                    this.wafConfig.rate_limit.endpoint_limits = {};
                }
                this.wafConfig.rate_limit.endpoint_limits[path] = {
                    requests_per_min: rpm,
                    burst_size: burst
                };

                // Sync with server
                await this.syncConfig('Endpoint limit added');
                event.target.reset();
            }

            async removeEndpointLimit(path) {
                if (!confirm(`Are you sure you want to remove limits for ${path}?`)) return;

                if (this.wafConfig.rate_limit.endpoint_limits && this.wafConfig.rate_limit.endpoint_limits[path]) {
                    delete this.wafConfig.rate_limit.endpoint_limits[path];
                    await this.syncConfig('Endpoint limit removed');
                }
            }

            async syncConfig(successMessage) {
                try {
                    const response = await fetch(`${API_BASE}/config`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.wafConfig)
                    });

                    const result = await response.json();

                    if (result.success) {
                        this.wafConfig = result.config || this.wafConfig; // Use returned config if available, otherwise keep local (but usually we reload)
                        // Reload config to be sure
                        await this.loadWAFConfig();

                        this.showPopupNotification(
                            'success',
                            'Configuration Updated',
                            successMessage || 'Settings saved successfully',
                            null
                        );
                        this.render();
                    } else {
                        this.showPopupNotification('error', 'Update Failed', result.message, null);
                    }
                } catch (error) {
                    this.showPopupNotification('error', 'Error', error.message, null);
                }
            }
            async updateBackend(event) {
                event.preventDefault();
                const backendURL = event.target.backend_url.value.trim();

                if (!backendURL) return;

                // Validate URL format
                try {
                    new URL(backendURL);
                } catch (e) {
                    this.showPopupNotification(
                        'error',
                        'Invalid URL',
                        'Please enter a valid URL (e.g., http://localhost:8000)',
                        null
                    );
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/backend`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ backend_url: backendURL })
                    });

                    const result = await response.json();

                    if (result.success) {
                        this.backendURL = result.backend;
                        this.showPopupNotification(
                            'success',
                            'Backend Updated!',
                            `Successfully updated backend to: ${result.backend}`,
                            null
                        );
                        this.render();
                    } else {
                        this.showPopupNotification(
                            'error',
                            'Update Failed',
                            result.message || 'Failed to update backend server',
                            null
                        );
                    }
                } catch (error) {
                    this.showPopupNotification(
                        'error',
                        'Error',
                        `Failed to update backend: ${error.message}`,
                        null
                    );
                }
            }


            // --- Log Details Modal ---

            showLogDetails(requestId) {
                const log = this.logs.find(l => l.request_id === requestId);
                if (!log) return;

                const content = document.getElementById('logModalContent');

                // Helper for labeled value
                const field = (label, value, className = '') => `
                    <div class="mb-4">
                        <div class="text-xs text-gray-400 uppercase tracking-wide mb-1">${label}</div>
                        <div class="font-mono text-sm break-all ${className}">${value !== undefined && value !== null ? value : '-'}</div>
                    </div>
                `;

                // Helper for section header
                const section = (title) => `
                    <div class="border-b border-gray-700 pb-2 mb-4 mt-2">
                        <h4 class="text-cyan-400 font-bold uppercase text-xs tracking-wider">${title}</h4>
                    </div>
                `;

                content.innerHTML = `
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            ${section('General Info')}
                            ${field('Timestamp', this.formatTime(log.timestamp))}
                            ${field('Request ID', log.request_id)}
                            ${field('Client IP', log.client_ip)}
                            ${field('Method', log.method, 'font-bold text-white')}
                        </div>
                        <div>
                            ${section('Decision')}
                            ${field('Type', this.renderDecisionBadge(log.decision))}
                            ${field('Total Score', log.total_score.toFixed(2), log.total_score > 0 ? (log.total_score > 5 ? 'text-red-400' : 'text-yellow-400') : 'text-green-400')}
                            ${field('Latency', log.latency_ms + ' ms')}
                            ${field('Response Status', log.response_status)}
                        </div>
                    </div>

                    ${section('Request Details')}
                    <div class="grid grid-cols-1 gap-4">
                        ${field('Path', log.path)}
                        ${field('Query', log.query || '<span class="text-gray-500 italic">None</span>')}
                        ${field('User Agent', log.user_agent || '<span class="text-gray-500 italic">Unknown</span>')}
                    </div>

                    ${section('Security Analysis')}
                    
                    ${log.matched_rules && log.matched_rules.length > 0 ? `
                        <div class="bg-gray-800 rounded border border-gray-700 overflow-hidden">
                            <table class="w-full text-sm">
                                <thead class="bg-gray-700">
                                    <tr>
                                        <th class="px-3 py-2 text-left text-xs">Rule ID</th>
                                        <th class="px-3 py-2 text-left text-xs">Category</th>
                                        <th class="px-3 py-2 text-left text-xs">Payload</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-700">
                                    ${log.matched_rules.map(rule => `
                                        <tr>
                                            <td class="px-3 py-2 font-mono text-cyan-300">${rule.rule_id}</td>
                                            <td class="px-3 py-2 text-gray-400">${rule.category}</td>
                                            <td class="px-3 py-2 text-gray-300 break-all font-mono text-xs bg-gray-900/50 p-1 rounded">${rule.payload ? rule.payload.replace(/</g, '&lt;').replace(/>/g, '&gt;') : '-'}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    ` : `
                        <div class="p-3 bg-green-900/20 border border-green-900/50 rounded text-green-400 text-sm flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                            No rules matched. Safe request.
                        </div>
                    `}
                `;

                document.getElementById('logModal').classList.add('active');
            }

            closeLogModal() {
                document.getElementById('logModal').classList.remove('active');
            }

            attachEventListeners() {
                // Event listeners are attached via onclick attributes
            }
        }

        // Initialize dashboard
        const dashboard = new WAFDashboard();

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            dashboard.stopAutoRefresh();
        });
    </script>
</body>

</html>
