                            <div>
                                <label class="block text-xs font-medium text-muted mb-1.5">New backend URL</label>
                                <input type="text" name="backend_url" placeholder="http://localhost:8000" value="${validBackend ? this.backendURL : ''}" required class="pill-input w-full font-mono">
                                <p class="text-[11px] text-faint mt-1">All future traffic will be proxied to this URL.</p>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                                Update backend
                            </button>
                        </form>
                    </div>
                `;
            }

            _renderConfigDetection(block_t, chal_t) {
                return `
                    <div class="glass p-6">
                        <div class="section-head">
                            <div class="section-icon" style="color: var(--pill-block-fg);"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg></div>
                            <div>
                                <h3 class="text-base font-bold">Detection Thresholds</h3>
                                <p class="text-xs text-faint">When the request score crosses these, the WAF acts</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-5">
                            ${this.renderStatCard('Block ≥',     block_t.toFixed(1), 'red')}
                            ${this.renderStatCard('Challenge ≥', chal_t.toFixed(1),  'amber')}
                        </div>

                        <form onsubmit="dashboard.updateWAFConfig(event)" class="space-y-4">
                            <div class="grid md:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs text-muted mb-1.5">Block threshold <span class="text-faint">(score ≥ → BLOCK)</span></label>
                                    <input type="number" step="0.1" min="0" max="100" name="block_threshold" value="${block_t}" required class="pill-input w-full">
                                    <p class="text-[11px] text-faint mt-1">Range 0.0 – 100.0</p>
                                </div>
                                <div>
                                    <label class="block text-xs text-muted mb-1.5">Challenge threshold <span class="text-faint">(score ≥ → CHALLENGE)</span></label>
                                    <input type="number" step="0.1" min="0" max="100" name="challenge_threshold" value="${chal_t}" required class="pill-input w-full">
                                    <p class="text-[11px] text-faint mt-1">Must be less than block threshold</p>
                                </div>
                            </div>
                            <input type="hidden" name="requests_per_min" value="${this.wafConfig ? this.wafConfig.rate_limit.requests_per_min : 100}">
                            <input type="hidden" name="burst_size" value="${this.wafConfig ? this.wafConfig.rate_limit.burst_size : 20}">
                            <button type="submit" class="btn btn-primary">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                                Save thresholds
                            </button>
                        </form>

                        <div class="mt-5 rounded-lg p-3 flex items-start gap-2.5" style="background: var(--pill-log-bg); border: 1px solid var(--pill-log-bd);">
                            <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--pill-log-fg);"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <p class="text-xs" style="color: var(--fg-1);">Lower the block threshold for stricter protection. The gray zone <span class="font-mono" style="color: var(--accent);">[challenge, block)</span> is where the ML model can override the verdict.</p>
                        </div>
                    </div>
                `;
            }

            _renderConfigRateLimit(rpm, burst, epLimits, epCount) {
                return `
                    <div class="space-y-5">
                        <!-- Global -->
                        <div class="glass p-6">
                            <div class="section-head">
                                <div class="section-icon" style="color: var(--accent);"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
                                <div>
                                    <h3 class="text-base font-bold">Global Rate Limiting</h3>
                                    <p class="text-xs text-faint">Token bucket per client IP — applies when no endpoint override matches</p>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-3 mb-5">
                                ${this.renderStatCard('Per-min',  rpm.toLocaleString(),   'cyan')}
                                ${this.renderStatCard('Burst',    burst.toLocaleString(), 'green')}
                            </div>

                            <form onsubmit="dashboard.updateWAFConfig(event)" class="space-y-4">
                                <div class="grid md:grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-xs text-muted mb-1.5">Requests per minute <span class="text-faint">(per IP)</span></label>
                                        <input type="number" min="60" max="10000" name="requests_per_min" value="${rpm}" required class="pill-input w-full">
                                        <p class="text-[11px] text-faint mt-1">Range 60 – 10,000 (must be ≥ 60 for refill to fire)</p>
                                    </div>
                                    <div>
                                        <label class="block text-xs text-muted mb-1.5">Burst size <span class="text-faint">(short-term allowance)</span></label>
                                        <input type="number" min="1" max="1000" name="burst_size" value="${burst}" required class="pill-input w-full">
                                        <p class="text-[11px] text-faint mt-1">Range 1 – 1,000</p>
                                    </div>
                                </div>
                                <input type="hidden" name="block_threshold" value="${this.wafConfig ? this.wafConfig.decision.block_threshold : 5.0}">
                                <input type="hidden" name="challenge_threshold" value="${this.wafConfig ? this.wafConfig.decision.challenge_threshold : 4.0}">
                                <button type="submit" class="btn btn-primary">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                                    Save global limits
                                </button>
                            </form>
                        </div>

                        <!-- Endpoint specific -->
                        <div class="glass p-6">
                            <div class="section-head">
                                <div class="section-icon" style="color: var(--accent-2);"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h10M4 18h6"/></svg></div>
                                <div>
                                    <h3 class="text-base font-bold">Endpoint-Specific Limits</h3>
                                    <p class="text-xs text-faint">Override the global bucket for specific paths (exact match) — useful for /login brute-force protection</p>
                                </div>
                                <span class="chip ml-auto">${epCount}</span>
                            </div>

                            <form onsubmit="dashboard.addEndpointLimit(event)" class="grid grid-cols-1 md:grid-cols-12 gap-2 mb-4">
                                <input name="path"  type="text"   placeholder="/api/login" required class="pill-input md:col-span-6 font-mono">
                                <input name="rpm"   type="number" min="1" placeholder="RPM"   required class="pill-input md:col-span-2">
                                <input name="burst" type="number" min="1" placeholder="Burst" required class="pill-input md:col-span-2">
                                <button type="submit" class="btn btn-primary md:col-span-2 justify-center">Add</button>
                            </form>

                            <div class="rounded-lg overflow-hidden" style="border: 1px solid var(--line);">
                                <table class="data-table">
                                    <thead><tr><th>Path</th><th class="text-right">RPM</th><th class="text-right">Burst</th><th class="text-right">Action</th></tr></thead>
                                    <tbody>
                                        ${epCount === 0 ? `
                                            <tr><td colspan="4" class="px-4 py-8 text-center text-faint">No endpoint-specific limits configured.</td></tr>
                                        ` : Object.entries(epLimits).map(([path, limit]) => `
                                            <tr style="cursor: default;">
                                                <td><span class="chip">${path}</span></td>
                                                <td class="text-right font-mono">${limit.requests_per_min}</td>
                                                <td class="text-right font-mono">${limit.burst_size}</td>
                                                <td class="text-right">
                                                    <button onclick="dashboard.removeEndpointLimit('${path}')" class="btn btn-ghost py-1 px-2 text-xs" style="color: var(--pill-block-fg);">Remove</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>

                            <div class="mt-4 rounded-lg p-3 flex items-start gap-2.5" style="background: var(--pill-chal-bg); border: 1px solid var(--pill-chal-bd);">
                                <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--pill-chal-fg);"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                                <p class="text-xs" style="color: var(--fg-1);">Endpoint match is <span class="font-mono" style="color: var(--pill-chal-fg);">exact</span> (not prefix). Each override creates a separate per-IP bucket — global bucket is unaffected.</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            _renderConfigBypass() {
                const builtIn = ['/socket.io/', '/sockjs-node/', '/ws/', '/_ws/', '/health', '/healthz', '/metrics', '/dashboard', '/waf-api/'];
                const list = this.bypassPaths || [];
                return `
                    <div class="glass p-6">
                        <div class="section-head">
                            <div class="section-icon" style="color: var(--pill-model-fg);"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg></div>
                            <div>
                                <h3 class="text-base font-bold">Bypass Paths</h3>
                                <p class="text-xs text-faint">Skip WAF inspection AND audit log for these path prefixes</p>
                            </div>
                            <span class="chip ml-auto">${list.length}</span>
                        </div>

                        <div class="rounded-lg p-4 mb-4" style="background: var(--surface); border: 1px solid var(--line);">
                            <div class="text-[10px] uppercase tracking-wider text-faint mb-2">Built-in (always bypassed)</div>
                            <div class="flex flex-wrap gap-1.5">
                                ${builtIn.map(p => `<span class="chip">${p}</span>`).join('')}
                            </div>
                        </div>

                        <form onsubmit="dashboard.addBypassPath(event)" class="flex gap-2 mb-3">
                            <input name="path" type="text" placeholder="/api/heartbeat or /poll" required class="pill-input flex-1 font-mono">
                            <button type="submit" class="btn btn-primary">Add</button>
                        </form>

                        <div class="space-y-2 max-h-96 overflow-y-auto">
                            ${list.length > 0 ? list.map(p => `
                                <div class="flex items-center justify-between rounded-lg px-3 py-2" style="background: var(--surface); border: 1px solid var(--line);">
                                    <span class="chip">${p.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>
                                    <button class="btn btn-ghost py-1 px-2 text-xs" style="color: var(--pill-block-fg);" onclick="dashboard.removeBypassPath('${p.replace(/'/g, '&#39;')}')" title="Remove">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                                    </button>
                                </div>
                            `).join('') : `
                                <div class="rounded-lg p-4 text-center text-sm text-faint" style="background: var(--surface); border: 1px dashed var(--line);">
                                    No custom bypass paths configured.
                                </div>
                            `}
                        </div>

                        <div class="mt-4 rounded-lg p-3 flex items-start gap-2.5" style="background: var(--pill-log-bg); border: 1px solid var(--pill-log-bd);">
                            <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--pill-log-fg);"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <p class="text-xs" style="color: var(--fg-1);">Match is <span class="font-mono" style="color: var(--pill-log-fg);">prefix</span>. Bypassed requests skip rule evaluation, ML inference, rate limit, AND audit log entirely.</p>
                        </div>
                    </div>
                `;
            }

            renderStatCard(label, value, color, iconPath = '', subtext = '') {
                const valueColor = {
                    cyan:  'var(--accent)',
                    red:   'var(--pill-block-fg)',
                    green: 'var(--pill-allow-fg)',
                    amber: 'var(--pill-chal-fg)',
                    blue:  'var(--pill-log-fg)',
                    yellow:'var(--pill-chal-fg)'
                }[color] || 'var(--fg-0)';
                return `
                    <div class="stat-card">
                        ${iconPath ? `<div class="stat-icon" style="color: ${valueColor};"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${iconPath}"/></svg></div>` : ''}
                        <div class="stat-label">${label}</div>
                        <div class="stat-value" style="color: ${valueColor};">${value}</div>
                        ${subtext ? `<div class="stat-sub">${subtext}</div>` : ''}
                    </div>
                `;
            }

            renderDecisionBadge(decision) {
                const map = {
                    BLOCK:     { cls: 'pill-block', label: 'Block' },
                    ALLOW:     { cls: 'pill-allow', label: 'Allow' },
                    CHALLENGE: { cls: 'pill-chal',  label: 'Challenge' },
                    LOG:       { cls: 'pill-log',   label: 'Log' }
                };
                const m = map[decision];
                if (!m) return `<span class="pill pill-method">${decision}</span>`;
                return `<span class="pill ${m.cls}"><span class="pill-dot"></span>${m.label}</span>`;
            }

            renderSourceBadge(log) {
                // Server already labels each entry. Fall back to deriving from
                // matched_rules + ml so older logs without `source` still render.
                let src = log.source;
                if (!src) {
                    const hasRule = log.matched_rules && log.matched_rules.length > 0;
                    const hasML = log.ml && log.ml.score_adjust;
                    src = hasRule && hasML ? 'rule+model' : hasML ? 'model' : hasRule ? 'rule' : '-';
                }
                const ruleCount = log.matched_rules ? log.matched_rules.length : 0;
                const conf = log.ml && log.ml.confidence ? Math.round(log.ml.confidence * 100) + '%' : '';
                const mlLabel = log.ml && log.ml.label ? log.ml.label : '';

                const ruleIcon  = `<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065zM15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>`;
                const modelIcon = `<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>`;

                const shieldIcon = `<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>`;

                switch (src) {
                    case 'rule':
                        return `<span class="pill pill-rule" title="${ruleCount} rule(s) matched">${ruleIcon}rule${ruleCount > 1 ? ' ×' + ruleCount : ''}</span>`;
                    case 'model':
                        return `<span class="pill pill-model" title="ML: ${mlLabel} (${conf})">${modelIcon}model${mlLabel ? ' · ' + mlLabel : ''}</span>`;
                    case 'rule+model':
                        return `<span class="pill pill-both" title="${ruleCount} rule(s) + ML ${mlLabel} (${conf})">${ruleIcon}${modelIcon}<span>rule+model</span></span>`;
                    case 'whitelist':
                        return `<span class="pill pill-allow" title="IP on the admin whitelist — auto-allowed">${shieldIcon}whitelist</span>`;
                    default:
                        return `<span class="text-xs text-slate-600">—</span>`;
                }
            }

            formatTime(timestamp) {
                const date = new Date(timestamp);
                return date.toLocaleTimeString();
            }

            switchTab(tab) {
                this.currentTab = tab;
                this.uploadNotification = null;
                this.render();
            }

            // Pull TTL value (seconds) from an add-IP form. Returns 0 for
            // permanent entries, an integer >0 for time-bound entries, or
            // NaN if the user picked "custom" but left the input blank/invalid
            // (caller should reject).
            _readTTLFromForm(form) {
                const sel = form.ttl ? form.ttl.value : '0';
                if (sel === 'custom') {
                    const n = parseInt((form.ttlCustom && form.ttlCustom.value) || '', 10);
                    return Number.isFinite(n) && n > 0 ? n : NaN;
                }
                return parseInt(sel, 10) || 0;
            }

            async toggleRule(id, nextEnabled, checkboxEl) {
                if (checkboxEl) checkboxEl.disabled = true;
                try {
                    const getResp = await authFetch(`${API_BASE}/rules/get/${encodeURIComponent(id)}`);
                    if (!getResp.ok) throw new Error(`fetch rule failed (${getResp.status})`);
                    const rule = await getResp.json();
                    rule.enabled = !!nextEnabled;

                    const saveResp = await authFetch(`${API_BASE}/rules/save`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ rule }),
                    });
                    const result = await saveResp.json();
                    if (!result.success) throw new Error((result.errors && result.errors[0]) || result.message || 'save failed');

                    const local = (this.allRules || []).find(x => x.id === id);
                    if (local) local.enabled = nextEnabled;
                    showToast(`Rule ${id} → ${nextEnabled ? 'enabled' : 'disabled'}`, 'success');
                } catch (e) {
                    if (checkboxEl) checkboxEl.checked = !nextEnabled;
                    showToast(`Toggle lỗi: ${e.message}`, 'error');
                } finally {
                    if (checkboxEl) checkboxEl.disabled = false;
                }
            }

            async loadWAFConfig() {
                try {
                    const response = await authFetch(`${API_BASE}/config`);
                    const data = await response.json();
                    this.wafConfig = data;
                    // Surface bypass paths as a top-level field so renderConfiguration
                    // can read it without diving into wafConfig.decision every time.
                    this.bypassPaths = (data && data.decision && Array.isArray(data.decision.bypass_paths))
                        ? data.decision.bypass_paths : [];
                } catch (error) {
                    console.error('Failed to load WAF config:', error);
                    this.wafConfig = null;
                    this.bypassPaths = [];
                }
            }

            async addBypassPath(event) {
                event.preventDefault();
                const path = event.target.path.value.trim();
                if (!path) return;
                if (!path.startsWith('/')) {
                    this.showPopupNotification('error', 'Invalid path', 'Path must start with "/" — e.g. /api/heartbeat', null);
                    return;
                }
                if ((this.bypassPaths || []).includes(path)) {
                    this.showPopupNotification('error', 'Duplicate', `${path} is already bypassed.`, null);
                    return;
                }
                const next = [...(this.bypassPaths || []), path];
                await this._saveBypassPaths(next, `Bypass added: ${path}`);
                event.target.reset();
            }

            async removeBypassPath(path) {
                const next = (this.bypassPaths || []).filter(p => p !== path);
                await this._saveBypassPaths(next, `Bypass removed: ${path}`);
            }

            async _saveBypassPaths(list, msg) {
                try {
                    const body = {
                        decision: {
                            block_threshold:     this.wafConfig ? this.wafConfig.decision.block_threshold     : 5.0,
                            challenge_threshold: this.wafConfig ? this.wafConfig.decision.challenge_threshold : 4.0,
                            bypass_paths:        list
                        },
                        rate_limit: {
                            requests_per_min: this.wafConfig ? this.wafConfig.rate_limit.requests_per_min : 1000,
                            burst_size:       this.wafConfig ? this.wafConfig.rate_limit.burst_size       : 100,
                            endpoint_limits:  (this.wafConfig && this.wafConfig.rate_limit.endpoint_limits) || {}
                        }
                    };
                    const res = await authFetch(`${API_BASE}/config`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const result = await res.json();
                    if (result.success) {
                        // Server returns the canonical (deduped) list.
                        const synced = (result.config && result.config.decision && result.config.decision.bypass_paths) || list;
                        this.bypassPaths = synced;
                        if (this.wafConfig && this.wafConfig.decision) this.wafConfig.decision.bypass_paths = synced;
                        this.showPopupNotification('success', 'Saved', msg, null);
                        this.softRefresh();
                    } else {
                        this.showPopupNotification('error', 'Save failed', result.message || 'Server rejected the change', null);
                    }
                } catch (err) {
                    this.showPopupNotification('error', 'Network error', err.message, null);
                }
            }

            async updateWAFConfig(event) {
                event.preventDefault();
                const formData = new FormData(event.target);

                const config = {
                    decision: {
                        block_threshold: parseFloat(formData.get('block_threshold')),
                        challenge_threshold: parseFloat(formData.get('challenge_threshold')),
                        bypass_paths: this.bypassPaths || []
                    },
                    rate_limit: {
                        requests_per_min: parseInt(formData.get('requests_per_min')),
                        burst_size: parseInt(formData.get('burst_size')),
                        endpoint_limits: this.wafConfig.rate_limit.endpoint_limits || {}
                    }
                };

                // Validate
                if (config.decision.challenge_threshold >= config.decision.block_threshold) {
                    this.showPopupNotification(
                        'error',
                        'Invalid Configuration',
                        'Challenge threshold must be less than block threshold',
                        null
                    );
                    return;
                }

                try {
                    const response = await authFetch(`${API_BASE}/config`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config)
                    });

                    const result = await response.json();

                    if (result.success) {
                        this.wafConfig = result.config;
                        this.showPopupNotification(
                            'success',
                            'Configuration Updated!',
                            `Block: ${config.decision.block_threshold}, Challenge: ${config.decision.challenge_threshold}, RPM: ${config.rate_limit.requests_per_min}`,
                            null
                        );
                        this.render();
                    } else {
                        this.showPopupNotification(
                            'error',
                            'Update Failed',
                            result.message || 'Failed to update configuration',
                            null
                        );
                    }
                } catch (error) {
                    this.showPopupNotification(
                        'error',
                        'Error',
                        `Failed to update configuration: ${error.message}`,
                        null
                    );
                }
            }

            async addEndpointLimit(event) {
                event.preventDefault();
                const path = event.target.path.value.trim();
                const rpm = parseInt(event.target.rpm.value);
                const burst = parseInt(event.target.burst.value);

                if (!path || !rpm || !burst) return;

                // Update local config
                if (!this.wafConfig.rate_limit.endpoint_limits) {
                    this.wafConfig.rate_limit.endpoint_limits = {};
                }
                this.wafConfig.rate_limit.endpoint_limits[path] = {
                    requests_per_min: rpm,
                    burst_size: burst
                };

                // Sync with server
                await this.syncConfig('Endpoint limit added');
                event.target.reset();
            }

            async removeEndpointLimit(path) {
                if (!confirm(`Are you sure you want to remove limits for ${path}?`)) return;

                if (this.wafConfig.rate_limit.endpoint_limits && this.wafConfig.rate_limit.endpoint_limits[path]) {
                    delete this.wafConfig.rate_limit.endpoint_limits[path];
                    await this.syncConfig('Endpoint limit removed');
                }
            }

            async syncConfig(successMessage) {

                    const response = await authFetch(`${API_BASE}/config`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.wafConfig)
                    });

                    const result = await response.json();

                    if (result.success) {
                        this.wafConfig = result.config || this.wafConfig; // Use returned config if available, otherwise keep local (but usually we reload)
                        // Reload config to be sure
                        await this.loadWAFConfig();

                        this.showPopupNotification(
                            'success',
                            'Configuration Updated',
                            successMessage || 'Settings saved successfully',
                            null
                        );
                        this.render();
                    } else {
                        this.showPopupNotification('error', 'Update Failed', result.message, null);
                    }
                } catch (error) {
                    this.showPopupNotification('error', 'Error', error.message, null);
                }
            }

                `;

                const section = (title, count) => `
                    <div class="flex items-center gap-2 mt-6 mb-3">
                        <h4 class="text-[11px] uppercase tracking-[0.12em] text-slate-400 font-semibold">${title}</h4>
                        ${count !== undefined ? `<span class="chip">${count}</span>` : ''}
                        <div class="flex-1 h-px" style="background: linear-gradient(90deg, var(--line-strong), transparent);"></div>
                    </div>
                `;

                const scoreColor = log.total_score > 5 ? 'text-red-300' : log.total_score > 2 ? 'text-amber-300' : log.total_score > 0 ? 'text-yellow-300' : 'text-emerald-300';
                const escape = (s) => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

                const fullURL = log.path + (log.query ? '?' + log.query : '');
                const headerEntries = log.headers ? Object.entries(log.headers).sort((a, b) => a[0].localeCompare(b[0])) : [];
                content.innerHTML = `
                    <!-- Hero: status + method + path?query -->
                    <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-3 pb-5" style="border-bottom: 1px solid var(--line);">
                        <div class="flex items-start gap-2 min-w-0 flex-1 flex-wrap">
                            ${this.renderDecisionBadge(log.decision)}
                            <span class="pill pill-method">${log.method}</span>
                            <code class="font-mono text-sm break-all leading-relaxed" style="color: var(--fg-0);" title="${escape(fullURL)}">
                                <span>${escape(log.path)}</span>${log.query ? `<span style="color: var(--fg-3);">?</span><span style="color: var(--accent);">${escape(log.query)}</span>` : ''}
                            </code>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap flex-shrink-0">
                            ${this.renderSourceBadge(log)}
                            <span class="text-[11px] text-faint whitespace-nowrap">${this.formatTime(log.timestamp)}</span>
                        </div>
                    </div>

                    <!-- Quick stats grid -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5">
                        ${stat('Score',          log.total_score.toFixed(2), scoreColor)}
                        ${stat('Latency',        log.latency_ms.toFixed(1) + ' ms')}
                        ${stat('Status',         log.response_status, log.response_status >= 400 ? 'text-red-300' : 'text-emerald-300')}
                        ${stat('Client IP',      log.client_ip, 'text-cyan-300')}
                    </div>

                    <!-- Headers (each row collapsible) -->
                    ${section('Headers', headerEntries.length || undefined)}
                    ${headerEntries.length === 0 ? `
                        <div class="rounded-lg p-4 text-center text-sm text-faint" style="background: var(--surface); border: 1px dashed var(--line);">
                            No headers captured.
                        </div>
                    ` : `
                        <div class="rounded-lg overflow-hidden" style="border: 1px solid var(--line);">
                            ${headerEntries.map(([name, values]) => {
                                const arr = Array.isArray(values) ? values : [values];
                                const joined = arr.join('\n');
                                const long = joined.length > 64 || arr.length > 1 || joined.includes('\n');
                                const valHtml = arr.map(v => `<div class="font-mono text-xs break-all leading-relaxed" style="color: var(--fg-1);">${escape(String(v))}</div>`).join('');
                                const previewHtml = `<span class="font-mono text-xs truncate block" style="color: var(--fg-2);" title="${escape(joined)}">${escape(arr[0] || '')}</span>`;
                                return `
                                    <div data-h-row data-collapsed="true" style="border-bottom: 1px solid var(--line);">
                                        <button type="button" onclick="dashboard.toggleHeaderRow(this)" class="w-full text-left px-4 py-2.5 flex items-start gap-3 transition" style="background: transparent;" onmouseover="this.style.background='var(--surface)';" onmouseout="this.style.background='transparent';">
                                            <span class="font-mono text-xs font-semibold flex-shrink-0" style="color: var(--accent); min-width: 160px;">${escape(name)}</span>
                                            <span class="flex-1 min-w-0" data-h-preview>${previewHtml}</span>
                                            ${long ? `
                                                <svg class="w-3.5 h-3.5 mt-0.5 flex-shrink-0 transition-transform" data-h-chevron style="color: var(--fg-3); transform: rotate(-90deg);" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                                            ` : '<span class="w-3.5 h-3.5 flex-shrink-0"></span>'}
                                        </button>
                                        ${long ? `<div class="px-4 pb-3" data-h-full style="display: none;">${valHtml}</div>` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `}

                    ${log.matched_rules && log.matched_rules.length > 0 ? `
                        ${section('Matched Rules', log.matched_rules.length)}
                        <div class="rounded-lg overflow-hidden" style="border: 1px solid var(--line);">
                            <table class="data-table" style="font-size: 12px;">
                                <thead>
                                    <tr>
                                        <th>Rule ID</th>
                                        <th>Category</th>
                                        <th>Severity</th>
                                        <th>Payload</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${log.matched_rules.map(rule => `
                                        <tr style="cursor: default;">
                                            <td><span class="chip" style="color:#67e8f9;">${rule.rule_id}</span></td>
                                            <td class="text-slate-400 text-xs">${rule.category || '-'}</td>
                                            <td><span class="pill ${rule.severity === 'CRITICAL' ? 'pill-block' : rule.severity === 'HIGH' ? 'pill-chal' : 'pill-log'}">${rule.severity || '-'}</span></td>
                                            <td class="font-mono text-xs text-slate-300 break-all max-w-md">${escape(rule.payload || '-')}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    ` : ''}

                    ${log.ml && log.ml.called ? `
                        ${section('ML Verdict')}
                        ${log.ml.error ? `
                            <div class="rounded-lg p-4 flex items-start gap-3" style="background: rgba(234,179,8,0.06); border: 1px solid rgba(234,179,8,0.25);">
                                <svg class="w-5 h-5 text-amber-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                                <div>
                                    <div class="text-amber-300 font-semibold text-sm">ML inference unavailable</div>
                                    <div class="text-xs text-slate-400 font-mono mt-1">${escape(log.ml.error)}</div>
                                </div>
                            </div>
                        ` : `
                            <div class="rounded-lg p-5" style="background: rgba(168,85,247,0.04); border: 1px solid rgba(168,85,247,0.20);">
                                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                                    <div>
                                        <div class="text-[10px] uppercase tracking-wider text-slate-500 mb-1">Attack Type</div>
                                        <div class="font-mono text-base font-bold ${log.ml.is_attack ? 'text-red-300' : 'text-emerald-300'}">${log.ml.label || '—'}</div>
                                    </div>
                                    <div>
                                        <div class="text-[10px] uppercase tracking-wider text-slate-500 mb-1">Verdict</div>
                                        <div class="font-mono text-base font-bold">
                                            ${log.ml.is_attack
                                                ? '<span class="pill pill-block"><span class="pill-dot"></span>attack</span>'
                                                : '<span class="pill pill-allow"><span class="pill-dot"></span>benign</span>'}
                                        </div>
                                    </div>
                                    <div>
                                        <div class="text-[10px] uppercase tracking-wider text-slate-500 mb-1">Confidence</div>
                                        <div class="font-mono text-base font-bold text-cyan-300">${log.ml.confidence ? (log.ml.confidence * 100).toFixed(2) + '%' : '—'}</div>
                                    </div>
                                    <div>
                                        <div class="text-[10px] uppercase tracking-wider text-slate-500 mb-1">Score Δ</div>
                                        <div class="font-mono text-base font-bold ${log.ml.score_adjust > 0 ? 'text-red-300' : log.ml.score_adjust < 0 ? 'text-emerald-300' : 'text-slate-500'}">${log.ml.score_adjust ? (log.ml.score_adjust > 0 ? '+' : '') + log.ml.score_adjust.toFixed(2) : '0.00'}</div>
                                    </div>
                                </div>
                                ${log.ml.confidence ? `
                                    <div>
                                        <div class="flex justify-between text-[10px] uppercase tracking-wider text-slate-500 mb-1.5">
                                            <span>Prediction confidence</span>
                                            <span class="text-slate-400">${(log.ml.confidence * 100).toFixed(1)}%</span>
                                        </div>
                                        <div class="conf-bar"><div style="width: ${(log.ml.confidence * 100).toFixed(1)}%"></div></div>
                                    </div>
                                ` : ''}
                                ${!log.ml.score_adjust ? `
                                    <div class="mt-3 text-[11px] text-slate-500 italic flex items-center gap-1.5">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                        Confidence below threshold — verdict logged but not applied to the score.
                                    </div>
                                ` : ''}
                            </div>
                        `}
                    ` : ''}

                    ${(!log.matched_rules || log.matched_rules.length === 0) && !(log.ml && log.ml.called) ? `
                        ${section('Security Analysis')}
                        <div class="rounded-lg p-4 flex items-center gap-3" style="background: rgba(34,197,94,0.05); border: 1px solid rgba(34,197,94,0.20);">
                            <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                            <span class="text-sm text-emerald-300">No rules matched and ML was not consulted — request looks clean.</span>
                        </div>
                    ` : ''}
                `;

                document.getElementById('logModal').classList.add('active');
            }

            closeLogModal() {
                document.getElementById('logModal').classList.remove('active');
            }

            attachEventListeners() {
                // Event listeners are attached via onclick attributes
            }
        }

        const dashboard = new WAFDashboard();

        window.addEventListener('beforeunload', () => {
            dashboard.stopAutoRefresh();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const drawer = document.getElementById('ruleBuilderDrawer');
                if (drawer && drawer.classList.contains('active')) dashboard.closeRuleBuilder();
            }
        });

        window.addEventListener('message', (e) => {
            const msg = e.data;
            if (!msg || typeof msg !== 'object') return;
            if (msg.type === 'rule-builder:close')  dashboard.closeRuleBuilder();
            if (msg.type === 'rule-builder:saved') {
                showToast(msg.message || 'Rule đã lưu', 'success');
                dashboard.loadData().then(() => dashboard.softRefresh());
            }
        });
    </script>
</body>

</html>
