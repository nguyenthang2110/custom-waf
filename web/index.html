                                            const caret = `<span class="ip-caret">▶</span>`;
                                            const row = `
                                                <tr class="ip-row ${isExpanded ? 'expanded' : ''}" onclick="dashboard.toggleIPDetails('${ip.ip.replace(/'/g, "\\'")}')">
                                                    <td style="text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${caret}<span class="chip" style="font-family:'JetBrains Mono',monospace">${ip.ip}</span></td>
                                                    <td style="text-align:center; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--fg-0); font-weight:600">${(ip.total_requests||0).toLocaleString()}</td>
                                                    <td style="text-align:center; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; color: ${ip.blocked_requests > 0 ? 'var(--pill-block-fg)' : 'var(--fg-3)'};">${(ip.blocked_requests||0).toLocaleString()}</td>
                                                    <td style="text-align:center">${statusPill(ip)}</td>
                                                    <td style="text-align:center">${susBar(ip.suspicion_score)}</td>
                                                    <td style="text-align:center; font-size:11px; color:var(--fg-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap" title="${(ip.detected_attacks||[]).join(', ')}">${ip.detected_attacks && ip.detected_attacks.length > 0 ? ip.detected_attacks.join(', ') : '—'}</td>
                                                    <td style="text-align:center; font-size:11px; color:var(--fg-3); white-space:nowrap">${this.formatTime(ip.last_seen)}</td>
                                                </tr>
                                            `;
                                            return row + (isExpanded ? this._renderIPDetailRow(ip) : '');
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Toggle sort column (click again on same column flips direction).
            sortIPs(key) {
                if (this.ipsSort.by === key) {
                    this.ipsSort.order = this.ipsSort.order === 'asc' ? 'desc' : 'asc';
                } else {
                    this.ipsSort.by = key;
                    // Default new column to descending for numerics, ascending for IP/status.
                    this.ipsSort.order = (key === 'ip' || key === 'status') ? 'asc' : 'desc';
                }
                this._softRerenderIPs();
            }

            // Clear all filter fields and re-render. Doesn't touch sort.
            // Time-field preference is preserved across resets so a user
            // who prefers "first_seen" doesn't get kicked back to default.
            resetIPFilters() {
                this.ipsFilters = {
                    ip: '', status: '', attack: '',
                    relativeTime: '', from: '', to: '',
                    timeField: this.ipsFilters.timeField || 'last_seen',
                };
                this._softRerenderIPs();
            }

            // Quick-range button — sliding window mode. Stores the relative
            // duration ('15m'/'1h'/'24h'/'7d') and clears any absolute
            // datetime-local values. The filter pipeline (_resolveTimeRange)
            // recomputes `now - X → now` on every render/fetch, so the
            // window keeps sliding as time advances (matches Grafana / Kibana).
            setIPTimeRange(span) {
                if (!['15m','1h','24h','7d'].includes(span)) return;
                this.ipsFilters.relativeTime = span;
                this.ipsFilters.from = '';
                this.ipsFilters.to   = '';
                this._softRerenderIPs();
            }

            clearIPTimeRange() {
                this.ipsFilters.relativeTime = '';
                this.ipsFilters.from = '';
                this.ipsFilters.to   = '';
                this._softRerenderIPs();
            }

            // Shared time-range resolver. Returns absolute {fromMs, toMs,
            // fromISO, toISO} for the given filter object. When
            // `relativeTime` is set, computes a sliding window against "now"
            // so the result is always current — that's what makes auto-refresh
            // and "click 15m" produce the same fresh data across both tabs.
            _resolveTimeRange(filt) {
                const RELS = { '15m': 15*60_000, '1h': 60*60_000, '24h': 24*60*60_000, '7d': 7*24*60*60_000 };
                if (filt && RELS[filt.relativeTime]) {
                    const now = new Date();
                    const from = new Date(now.getTime() - RELS[filt.relativeTime]);
                    return {
                        fromMs: from.getTime(),  toMs:   now.getTime(),
                        fromISO: from.toISOString(), toISO: now.toISOString(),
                    };
                }
                const out = { fromMs: NaN, toMs: NaN, fromISO: '', toISO: '' };
                if (filt && filt.from) {
                    const d = new Date(filt.from);
                    if (!isNaN(d)) { out.fromMs = d.getTime(); out.fromISO = d.toISOString(); }
                }
                if (filt && filt.to) {
                    const d = new Date(filt.to);
                    if (!isNaN(d)) { out.toMs = d.getTime(); out.toISO = d.toISOString(); }
                }
                return out;
            }

            // Human label for the active time range — used in the filter bar.
            _timeRangeLabel(filt) {
                const REL_LABELS = { '15m': 'Last 15 min', '1h': 'Last 1 h', '24h': 'Last 24 h', '7d': 'Last 7 d' };
                if (filt && REL_LABELS[filt.relativeTime]) return REL_LABELS[filt.relativeTime];
                if (filt && (filt.from || filt.to)) return 'Custom range';
                return '';
            }

            // Re-render only the IP tab content. Preserves focus on the
            // active filter input via DOM-diff trick: we restore selection
            // after innerHTML swap so typing isn't interrupted.
            _softRerenderIPs() {
                const active = document.activeElement;
                const isInput = active && (active.tagName === 'INPUT' || active.tagName === 'SELECT');
                const name = isInput ? (active.placeholder || active.tagName) : '';
                const selStart = isInput && active.selectionStart != null ? active.selectionStart : null;

                const tc = document.getElementById('tabContent');
                if (tc) tc.innerHTML = this.renderIPs();

                if (isInput) {
                    // Find the equivalent input in the new DOM by placeholder
                    // (we only have a handful of inputs, this is enough).
                    const candidates = tc.querySelectorAll('input, select');
                    for (const el of candidates) {
                        if ((el.placeholder || el.tagName) === name) {
                            el.focus();
                            if (selStart != null && el.setSelectionRange) {
                                try { el.setSelectionRange(selStart, selStart); } catch (_) {}
                            }
                            break;
                        }
                    }
                }
            }

            // Toggle the expanded detail panel for an IP row. Re-renders just
            // the tab content (not the whole shell) to keep nav state intact.
            toggleIPDetails(ip) {
                this.expandedIP = (this.expandedIP === ip) ? null : ip;
                const tc = document.getElementById('tabContent');
                if (tc) tc.innerHTML = this.renderIPs();
            }

            // Render the inline expand panel beneath an IP row. Pulls extra
            // fields the API surfaces (reasons, attack counts, failed/successful
            // attempts, unique paths, first/last seen, blocked-until).
            _renderIPDetailRow(ip) {
                const reasons = (ip.reasons || []);
                const counts  = ip.attack_counts || {};
                const fmt = (t) => t ? this.formatTime(t) : '<span style="color:var(--fg-3)">—</span>';

                const reasonHTML = reasons.length === 0
                    ? `<p class="text-xs text-faint" style="margin:0">No specific signals — traffic looks normal.</p>`
                    : `<ul class="ip-reason-list">${reasons.map(r => `<li>${this._escapeHTML(r)}</li>`).join('')}</ul>`;

                const attackKeys = Object.keys(counts);
                const attacksHTML = attackKeys.length === 0
                    ? `<span class="text-xs text-faint">—</span>`
                    : `<div class="ip-attack-chips">${attackKeys.sort().map(k =>
                        `<span class="ip-attack-chip">${this._escapeHTML(k)}<span class="cnt">×${counts[k]}</span></span>`
                      ).join('')}</div>`;

                return `
                    <tr class="ip-detail-row">
                        <td colspan="7">
                            <div class="ip-detail-panel">
                                <div class="ip-detail-section-title">Why this status</div>
                                ${reasonHTML}

                                <div class="ip-detail-section-title" style="margin-top:14px">Detected attacks</div>
                                ${attacksHTML}

                                <div class="ip-detail-section-title" style="margin-top:16px">Behavior signals</div>
                                <div class="ip-detail-grid">
                                    <div class="ip-detail-cell">
                                        <span class="lbl">Suspicion score</span>
                                        <span class="val">${(ip.suspicion_score || 0).toFixed(2)} <span style="color:var(--fg-3);font-size:11px">/ 1.00</span></span>
                                    </div>
                                    <div class="ip-detail-cell">
                                        <span class="lbl">Is suspicious</span>
                                        <span class="val" style="color:${ip.is_suspicious ? 'var(--pill-chal-fg)' : 'var(--fg-2)'}">${ip.is_suspicious ? 'yes' : 'no'}</span>
                                    </div>
                                    <div class="ip-detail-cell">
                                        <span class="lbl">Is blocked</span>
                                        <span class="val" style="color:${ip.is_blocked ? 'var(--pill-block-fg)' : 'var(--fg-2)'}">${ip.is_blocked ? 'yes' : 'no'}</span>
                                    </div>
                                    <div class="ip-detail-cell">
                                        <span class="lbl">Is bot</span>
                                        <span class="val" style="color:${ip.is_bot ? 'var(--pill-chal-fg)' : 'var(--fg-2)'}">${ip.is_bot ? 'yes' : 'no'}</span>
                                    </div>
                                    <div class="ip-detail-cell">
                                        <span class="lbl">Total requests</span>
                                        <span class="val">${(ip.total_requests||0).toLocaleString()}</span>
                                    </div>
                                    <div class="ip-detail-cell">
                                        <span class="lbl">Blocked requests</span>
                                        <span class="val" style="color:${ip.blocked_requests>0?'var(--pill-block-fg)':'var(--fg-1)'}">${(ip.blocked_requests||0).toLocaleString()}</span>
                                    </div>
                                    <div class="ip-detail-cell">
                                        <span class="lbl">Failed attempts</span>
                                        <span class="val">${(ip.failed_attempts||0).toLocaleString()}</span>
                                    </div>
                                    <div class="ip-detail-cell">
                                        <span class="lbl">Successful attempts</span>
                                        <span class="val">${(ip.successful_attempts||0).toLocaleString()}</span>
                                    </div>
                                    <div class="ip-detail-cell">
                                        <span class="lbl">Unique paths accessed</span>
                                        <span class="val">${(ip.unique_paths_accessed||0).toLocaleString()}</span>
                                    </div>
                                    <div class="ip-detail-cell">
                                        <span class="lbl">First seen</span>
                                        <span class="val">${fmt(ip.first_seen)}</span>
                                    </div>
                                    <div class="ip-detail-cell">
                                        <span class="lbl">Last seen</span>
                                        <span class="val">${fmt(ip.last_seen)}</span>
                                    </div>
                                    <div class="ip-detail-cell">
                                        <span class="lbl">Blocked until</span>
                                        <span class="val">${fmt(ip.blocked_until)}</span>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }

            // Defensive HTML-escape for values that get interpolated into innerHTML.
            // The reasons/attack names come from the server but we render them as-is.
            _escapeHTML(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            renderStats() {
                const blockRate = (this.stats.block_rate || 0);
                const topRules = (this.stats.top_rules || []).slice(0, 5);
                const maxCount = topRules[0] ? topRules[0].count : 1;
                const sysRow = (label, value, color = 'var(--fg-0)') => `
                    <div class="flex items-center justify-between py-2.5" style="border-bottom: 1px solid var(--line);">
                        <span class="text-sm text-muted">${label}</span>
                        <span class="font-mono font-semibold text-sm" style="color: ${color};">${value}</span>
                    </div>`;

                return `
                    <div class="space-y-6">
                        <!-- KPI cards -->
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            ${this.renderStatCard('Total Requests', (this.stats.total_requests || 0).toLocaleString(), 'cyan',  'M13 10V3L4 14h7v7l9-11h-7z')}
                            ${this.renderStatCard('Blocked',        (this.stats.total_blocked  || 0).toLocaleString(), 'red',   'M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728L5.636 5.636m12.728 12.728L18.364 5.636M5.636 18.364l12.728-12.728', `${blockRate.toFixed(2)}% block rate`)}
                            ${this.renderStatCard('Allowed',        (this.stats.total_allowed  || 0).toLocaleString(), 'green', 'M5 13l4 4L19 7')}
                            ${this.renderStatCard('Avg Latency',     this.stats.avg_latency || '0s',                   'amber', 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z')}
                        </div>

                        <div class="grid md:grid-cols-2 gap-5">
                            <!-- Top Rules -->
                            <div class="glass p-5">
                                <div class="flex items-center justify-between mb-4">
                                    <div>
                                        <h3 class="text-base font-bold">Top Rules</h3>
                                        <p class="text-xs text-faint">Most-matched signatures</p>
                                    </div>
                                    <span class="chip">${topRules.length}</span>
                                </div>
                                <div class="space-y-2.5">
                                    ${topRules.length === 0 ? `
                                        <p class="text-sm text-faint">No rule matches yet.</p>
                                    ` : topRules.map((rule, i) => {
                                        const pct = Math.max(4, Math.round((rule.count / maxCount) * 100));
                                        return `
                                            <div class="flex items-center gap-3">
                                                <div class="w-5 text-xs font-mono text-faint">#${i + 1}</div>
                                                <span class="font-mono text-xs flex-shrink-0" style="color: var(--accent);">${rule.rule_id}</span>
                                                <div class="conf-bar flex-1"><div style="width: ${pct}%"></div></div>
                                                <span class="font-mono text-sm font-semibold w-10 text-right" style="color: var(--fg-0);">${rule.count}</span>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>

                            <!-- System Info -->
                            <div class="glass p-5">
                                <div class="flex items-center justify-between mb-4">
                                    <div>
                                        <h3 class="text-base font-bold">System</h3>
                                        <p class="text-xs text-faint">Runtime telemetry</p>
                                    </div>
                                    <span class="pill pill-allow"><span class="pill-dot"></span>Active</span>
                                </div>
                                ${sysRow('Rules loaded',   (this.stats.rules_loaded   || 0).toLocaleString(), 'var(--accent)')}
                                ${sysRow('Unique clients', (this.stats.unique_clients || 0).toLocaleString())}
                                ${sysRow('Uptime',          this.stats.uptime || '0s')}
                                <div class="flex items-center justify-between py-2.5">
                                    <span class="text-sm text-muted">Block rate</span>
                                    <span class="font-mono font-semibold text-sm" style="color: ${blockRate > 10 ? 'var(--pill-block-fg)' : 'var(--pill-allow-fg)'};">${blockRate.toFixed(2)}%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderAccessControl() {
                const sub = this.accessSubTab === 'blacklist' ? 'blacklist' : 'whitelist';
                const tabs = [
                    { id: 'whitelist', label: 'Whitelist', icon: 'M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z', meta: `${this.whitelist.length}` },
                    { id: 'blacklist', label: 'Blacklist', icon: 'M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728L5.636 5.636m12.728 12.728L18.364 5.636M5.636 18.364l12.728-12.728',                                                                            meta: `${this.blacklist.length}` },
                ];

                const sidebar = `
                    <aside class="glass p-2 self-start sticky top-24">
                        <div class="space-y-1">
                            ${tabs.map(t => `
                                <button class="side-tab ${sub === t.id ? 'active' : ''}" onclick="dashboard.switchAccessSubTab('${t.id}')">
                                    <span class="side-icon"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${t.icon}"/></svg></span>
                                    <span>${t.label}</span>
                                    ${t.meta ? `<span class="side-meta">${t.meta}</span>` : ''}
                                </button>
                            `).join('')}
                        </div>
                    </aside>
                `;

                const body = sub === 'blacklist'
                    ? this._renderAccessBlacklist()
                    : this._renderAccessWhitelist();

                return `
                    <div class="space-y-5">
                        <div>
                            <h2 class="text-xl font-bold tracking-tight">Access Control</h2>
                            <p class="text-xs text-faint mt-0.5">Static allow/deny lists — with optional time-bound entries</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
                            <div class="md:col-span-3">${sidebar}</div>
                            <div class="md:col-span-9">${body}</div>
                        </div>
                    </div>
                `;
            }

            // Predefined TTL options for the whitelist / blacklist form.
            // Value is seconds; "0" means permanent and is the default.
            _ttlOptions() {
                return [
                    { v: '0',       label: 'Permanent' },
                    { v: '900',     label: '15 minutes' },
                    { v: '3600',    label: '1 hour' },
                    { v: '14400',   label: '4 hours' },
                    { v: '86400',   label: '24 hours' },
                    { v: '604800',  label: '7 days' },
                    { v: '2592000', label: '30 days' },
                ];
            }

            // Format an absolute expiry timestamp into "in 5m", "in 2d", etc.
            // Returns "permanent" when expiresAt is empty/falsy.
            _formatRemaining(expiresAt) {
                if (!expiresAt) return '<span style="color:var(--pill-allow-fg)">permanent</span>';
                const t = new Date(expiresAt).getTime();
                const diff = Math.max(0, t - Date.now());
                const sec = Math.floor(diff / 1000);
                if (sec === 0) return '<span style="color:var(--pill-block-fg)">expired</span>';
                let pretty;
                if (sec < 60)        pretty = `${sec}s`;
                else if (sec < 3600) pretty = `${Math.floor(sec/60)}m`;
                else if (sec < 86400)pretty = `${Math.floor(sec/3600)}h ${Math.floor((sec%3600)/60)}m`;
                else                 pretty = `${Math.floor(sec/86400)}d ${Math.floor((sec%86400)/3600)}h`;
                return `<span style="color:var(--pill-chal-fg)">in ${pretty}</span>`;
            }

            // Shared renderer for whitelist + blacklist entry rows. Each row
            // shows IP, expiry, and a remove button. Entries with no expiry
            // (permanent) get a green pill; ttl entries get an "in Xm" hint.
            _renderAccessIPList(entries, kind) {
                if (!entries || entries.length === 0) {
                    return `<div class="rounded-lg p-4 text-center text-sm text-faint" style="background: var(--surface); border: 1px dashed var(--line);">No IP added yet.</div>`;
                }
                return entries.map(e => {
                    const ip = e.ip || e; // tolerate plain string for legacy callers
                    const exp = e.expires_at || '';
                    return `
                    <div class="flex items-center justify-between rounded-lg px-3 py-2 gap-3" style="background: var(--surface); border: 1px solid var(--line);">
                        <span class="chip font-mono">${this._escapeHTML(ip)}</span>
                        <span class="text-xs flex-1 text-right" title="${exp ? this._escapeHTML(exp) : 'no expiry'}">${this._formatRemaining(exp)}</span>
                        <button class="btn btn-ghost py-1 px-2 text-xs" style="color: var(--pill-block-fg);" onclick="dashboard.remove${kind}('${this._escapeHTML(ip)}')" title="Remove">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                `;}).join('');
            }

            // Add-IP form shared by whitelist/blacklist. The TTL <select>
            // picks one of the canned durations; "custom" reveals a number
            // input so an operator can type any seconds value.
            _renderAccessAddForm(submitter, btnClass, btnLabel) {
                const opts = this._ttlOptions()
                    .map(o => `<option value="${o.v}">${o.label}</option>`)
                    .join('');
                return `
                    <form class="flex flex-wrap gap-2 mb-4 items-center" onsubmit="dashboard.${submitter}(event)">
                        <input name="ip" type="text" placeholder="IP / CIDR (e.g. 10.0.0.0/24)" required class="pill-input flex-1 font-mono" style="min-width:200px">
                        <select name="ttl" class="pill-input" style="min-width:140px" onchange="this.form.ttlCustom.style.display = (this.value==='custom') ? '' : 'none'">
                            ${opts}
                            <option value="custom">Custom…</option>
                        </select>
                        <input name="ttlCustom" type="number" min="1" placeholder="seconds" class="pill-input font-mono" style="display:none; width:120px">
                        <button type="submit" class="btn ${btnClass}">${btnLabel}</button>
                    </form>
                `;
            }

            _renderAccessWhitelist() {
                return `
                    <div class="glass p-6">
                        <div class="section-head">
                            <div class="section-icon" style="color: var(--pill-allow-fg); background: var(--pill-allow-bg); border-color: var(--pill-allow-bd);"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg></div>
                            <div>
                                <h3 class="text-base font-bold">Whitelist</h3>
                                <p class="text-xs text-faint">IPs always allowed — bypass rule engine, behavior, rate limit. Optionally time-bound.</p>
                            </div>
                            <span class="chip ml-auto">${this.whitelist.length}</span>
                        </div>
                        ${this._renderAccessAddForm('submitWhitelist', 'btn-primary', 'Add')}
                        <div class="space-y-2 max-h-[520px] overflow-y-auto">${this._renderAccessIPList(this.whitelistEntries, 'Whitelist')}</div>
                        <div class="mt-4 rounded-lg p-3 flex items-start gap-2.5" style="background: var(--pill-log-bg); border: 1px solid var(--pill-log-bd);">
                            <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--pill-log-fg);"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <p class="text-xs" style="color: var(--fg-1);">Whitelisted IPs skip <span class="font-mono" style="color: var(--pill-log-fg);">ShouldBypassWAF</span> entirely. TTL'd entries auto-remove themselves once they expire.</p>
                        </div>
                    </div>
                `;
            }

            _renderAccessBlacklist() {
                return `
                    <div class="glass p-6">
                        <div class="section-head">
                            <div class="section-icon" style="color: var(--pill-block-fg); background: var(--pill-block-bg); border-color: var(--pill-block-bd);"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728L5.636 5.636m12.728 12.728L18.364 5.636M5.636 18.364l12.728-12.728"/></svg></div>
                            <div>
                                <h3 class="text-base font-bold">Blacklist</h3>
                                <p class="text-xs text-faint">IPs blocked outright. Optionally time-bound — useful for short-term ban after incident.</p>
                            </div>
                            <span class="chip ml-auto">${this.blacklist.length}</span>
                        </div>
                        ${this._renderAccessAddForm('submitBlacklist', 'btn-danger', 'Add')}
                        <div class="space-y-2 max-h-[520px] overflow-y-auto">${this._renderAccessIPList(this.blacklistEntries, 'Blacklist')}</div>
                        <div class="mt-4 rounded-lg p-3 flex items-start gap-2.5" style="background: var(--pill-block-bg); border: 1px solid var(--pill-block-bd);">
                            <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--pill-block-fg);"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                            <p class="text-xs" style="color: var(--fg-1);">Blacklist <span class="font-mono" style="color: var(--pill-block-fg);">always wins</span>. TTL'd entries auto-remove when they expire.</p>
                        </div>
                    </div>
                `;
            }

            renderRulesManagement() {
                const rules = this.allRules || [];
                const sev = (s) => ({CRITICAL:'pill-block',HIGH:'pill-chal',MEDIUM:'pill-log',LOW:'pill-rule',INFO:'pill-allow'}[(s||'').toUpperCase()] || 'pill-rule');
                const filtered = this.rulesFilter
                    ? rules.filter(r => {
                        const hay = (r.id + ' ' + r.category + ' ' + (r.description||'') + ' ' + ((r.tags||[]).join(' '))).toLowerCase();
                        return hay.includes(this.rulesFilter.toLowerCase());
                      })
                    : rules;
                const tableRows = filtered.length === 0
                    ? `<tr><td colspan="6" style="text-align:center; color:var(--fg-3); padding:28px">${rules.length === 0 ? 'Loading rules...' : 'No rules match filter'}</td></tr>`
                    : filtered.map(r => {
                        const ridAttr = r.id.replace(/'/g, "\\'");
                        return `
                        <tr>
                            <td><span class="font-mono text-xs" style="color: var(--accent); font-weight:600">${r.id}</span></td>
                            <td><span class="chip">${r.category||''}</span></td>
                            <td><span class="pill ${sev(r.severity)}"><span class="pill-dot"></span>${r.severity||''}</span></td>
                            <td style="color:var(--fg-1); font-size:12px; max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${(r.description||'').replace(/</g,'&lt;')}</td>
                            <td style="text-align:right; font-family:'JetBrains Mono',monospace; font-size:12px; color:${r.hit_count>0?'var(--accent)':'var(--fg-3)'}; font-weight:600">${(r.hit_count||0).toLocaleString()}</td>
                            <td style="text-align:right; white-space:nowrap">
                                <label class="switch-sm" title="${r.enabled ? 'Đang bật — click để tắt' : 'Đang tắt — click để bật'}">
                                    <input type="checkbox" ${r.enabled ? 'checked' : ''} onchange="dashboard.toggleRule('${ridAttr}', this.checked, this)">
                                    <span class="track"></span>
                                </label>
                                <button class="btn-icon-sm" style="margin-left:8px" onclick="dashboard.openRuleBuilder('${encodeURIComponent(r.id)}')" title="Edit rule">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                </button>
                            </td>
                        </tr>`;
                    }).join('');

                return `
                    <div class="space-y-5">
                        <div class="flex items-center justify-between gap-4 flex-wrap">
                            <div>
                                <h2 class="text-xl font-bold tracking-tight">Rules Management</h2>
                                <p class="text-xs text-faint mt-0.5">Hot-reload rule set · edit rule trực tiếp · auto-backup khi upload</p>
                            </div>
                            <div class="flex items-center gap-3 flex-wrap">
                                <input type="file" id="ruleFileInput" accept=".json" class="hidden" onchange="dashboard.handleFileSelect(event)">
                                <button onclick="document.getElementById('ruleFileInput').click()" class="btn btn-sm" title="Upload file JSON">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                    Chọn file rule…
                                </button>
                                <button onclick="dashboard.openRuleBuilder()" class="btn btn-primary" title="Tạo rule mới">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                                    Create Rule
                                </button>
                                <div class="stat-card" style="padding: 12px 18px;">
                                    <div class="stat-label" style="margin-bottom: 4px;">Loaded rules</div>
                                    <div class="stat-value" style="color: var(--accent); font-size: 22px;">${this.stats.rules_loaded || rules.length || 0}</div>
                                </div>
                            </div>
                        </div>

                        ${this.selectedFile ? `
                            <div class="rounded-lg p-3 flex items-center justify-between gap-4" style="background: var(--surface-strong); border: 1px solid var(--line-strong);">
                                <div class="flex items-center gap-3 min-w-0 text-left">
                                    <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0" style="background: var(--pill-log-bg); color: var(--pill-log-fg);">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                    </div>
                                    <div class="min-w-0">
                                        <p class="font-semibold truncate" style="color: var(--fg-0);">${this.selectedFile.name}</p>
                                        <p class="text-xs text-faint">${(this.selectedFile.size / 1024).toFixed(2)} KB · sẵn sàng upload</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2 flex-shrink-0">
                                    <button onclick="dashboard.selectedFile=null; document.getElementById('ruleFileInput').value=''; dashboard.render();" class="btn btn-sm" title="Bỏ chọn">✕</button>
                                    <button onclick="dashboard.uploadRulesFile()" class="btn btn-primary">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                                        Upload &amp; Apply
                                    </button>
                                </div>
                            </div>
                        ` : ''}
                        ${this.uploadNotification ? `<div>${this.uploadNotification}</div>` : ''}

                        <div class="glass p-0" style="overflow:hidden">
                            <div class="flex items-center justify-between gap-3" style="padding:14px 18px; border-bottom: 1px solid var(--line)">
                                <div style="display:flex; align-items:center; gap:10px">
                                    <svg class="w-4 h-4" fill="none" stroke="var(--accent)" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7h18M3 12h18M3 17h18"/></svg>
                                    <h3 class="text-base font-bold" style="margin:0">Rules ${rules.length > 0 ? `<span class="chip" style="margin-left:6px">${filtered.length}/${rules.length}</span>` : ''}</h3>
                                </div>
                                <input id="rulesFilterInput" placeholder="Filter by ID / category / description / tag..."
                                    value="${this.rulesFilter || ''}"
                                    oninput="dashboard.rulesFilter=this.value; dashboard.softRefresh();"
                                    style="background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px; color:var(--fg-0); min-width:300px; outline:none; font-family:'JetBrains Mono',monospace">
                            </div>
                            <div style="max-height:520px; overflow-y:auto">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>Rule ID</th>
                                            <th>Category</th>
                                            <th>Severity</th>
                                            <th>Description</th>
                                            <th style="text-align:right">Hits</th>
                                            <th style="text-align:right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>${tableRows}</tbody>
                                </table>
                            </div>
                        </div>

                    </div>
                `;
            }

            // ------------------------------------------------------------
            // Alerts tab — Slack / Email / Webhook outbound notifications.
            // First call loads config + stats from server, subsequent calls
            // just re-render the in-memory state (form bindings).
            // ------------------------------------------------------------
            async loadAlertsData() {
                try {
                    const [cR, sR] = await Promise.all([
                        authFetch(`${API_BASE}/alerts/config`),
                        authFetch(`${API_BASE}/alerts/stats`)
                    ]);
                    if (cR.ok) {
                        const j = await cR.json();
                        this.alertsConfig = j.config || null;
                    }
                    if (sR.ok) this.alertsStats = await sR.json();
                } catch (e) { /* swallow — render shows fallback */ }
            }

            // ------------------------------------------------------------
            // Alerts page — multi-destination per channel.
            //
            //   Sidebar:  General | Slack | Email | Webhook
            //   Channel pane: LIST mode (table of destinations + Create button)
            //                 EDITOR mode (form for one destination) when
            //                 alertsEditing is non-null.
            // ------------------------------------------------------------
            renderAlerts() {
                if (!this.alertsConfig) {
                    this.loadAlertsData().then(() => this.render());
                    return `<div class="glass p-6"><p style="color:var(--fg-3)">Loading alerts configuration…</p></div>`;
                }
                const c = this.alertsConfig;
                // Coerce nested fields to arrays in case server sent null.
                c.slack   = Array.isArray(c.slack)   ? c.slack   : [];
                c.email   = Array.isArray(c.email)   ? c.email   : [];
                c.webhook = Array.isArray(c.webhook) ? c.webhook : [];

                const stats = this.alertsStats || {};
                const sub = this.alertsSubTab || 'general';
                const editing = this.alertsEditing;

                const channelArr = (id) => {
                    if (id === 'slack')   return c.slack;
                    if (id === 'email')   return c.email;
                    if (id === 'webhook') return c.webhook;
                    return [];
                };
                const enabledCount = (id) => channelArr(id).filter(d => d.enabled).length;
                const totalCount   = (id) => channelArr(id).length;
                const tabMeta = (id) => {
                    const e = enabledCount(id);
                    const t = totalCount(id);
                    if (t === 0) return '0';
                    return `${e}/${t}`;
                };
                const tabMetaColor = (id) => enabledCount(id) > 0 ? 'var(--good)' : '';

                const tabs = [
                    { id: 'general', label: 'General',   icon: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065zM15 12a3 3 0 11-6 0 3 3 0 016 0z', meta: c.enabled ? 'enabled' : 'off', metaColor: c.enabled ? 'var(--good)' : '' },
                    { id: 'slack',   label: 'Slack',     icon: 'M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z', meta: tabMeta('slack'),   metaColor: tabMetaColor('slack') },
                    { id: 'email',   label: 'Email',     icon: 'M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z', meta: tabMeta('email'),   metaColor: tabMetaColor('email') },
                    { id: 'webhook', label: 'Webhook',   icon: 'M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71', meta: tabMeta('webhook'), metaColor: tabMetaColor('webhook') },
                ];

                const sidebar = `
                    <aside class="glass p-2 self-start sticky top-24">
                        <div class="space-y-1">
                            ${tabs.map(t => `
                                <button class="side-tab ${sub === t.id ? 'active' : ''}" onclick="dashboard.switchAlertsSubTab('${t.id}')">
                                    <span class="side-icon"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${t.icon}"/></svg></span>
                                    <span>${t.label}</span>
                                    ${t.meta ? `<span class="side-meta" style="${t.metaColor?'color:'+t.metaColor:''}">${t.meta}</span>` : ''}
                                </button>
                            `).join('')}
                        </div>
                        <div style="border-top:1px solid var(--line); margin:10px 6px 6px; padding-top:10px">
                            <div class="text-xs text-faint" style="padding:0 8px 6px">Lifetime stats</div>
                            <div style="padding:0 8px; font-family:'JetBrains Mono',monospace; font-size:11px; line-height:1.8; color:var(--fg-2)">
                                <div>queued: <b style="color:var(--fg-0)">${(stats.queued||0).toLocaleString()}</b></div>
                                <div>sent: <b style="color:var(--good)">${(stats.sent||0).toLocaleString()}</b></div>
                                <div>throttled: <b style="color:var(--fg-1)">${(stats.throttled||0).toLocaleString()}</b></div>
                                <div>below sev: <b style="color:var(--fg-1)">${(stats.below_severity||0).toLocaleString()}</b></div>
                                <div>failed: <b style="color:${stats.failed>0?'var(--bad)':'var(--fg-1)'}">${(stats.failed||0).toLocaleString()}</b></div>
                            </div>
                            ${stats.last_error ? `<div class="text-xs" style="padding:8px; color:var(--bad); word-break:break-all">${this._htmlEsc(stats.last_error)}</div>` : ''}
                        </div>
                    </aside>
                `;

                let body = '';
                if (sub === 'general') {
                    body = this._renderAlertsGeneral(c, stats);
                } else if (editing && editing.channel === sub) {
                    // Editor mode for one destination.
                    const arr = channelArr(sub);
                    const dest = arr[editing.index];
                    if (!dest) {
                        // Out of bounds — reset to list.
                        this.alertsEditing = null;
                        body = this._renderAlertsList(sub, arr);
                    } else if (sub === 'slack') {
                        body = this._renderAlertsSlackEditor(dest);
                    } else if (sub === 'email') {
                        body = this._renderAlertsEmailEditor(dest);
                    } else if (sub === 'webhook') {
                        body = this._renderAlertsWebhookEditor(dest);
                    }
                } else {
                    // List mode.
                    body = this._renderAlertsList(sub, channelArr(sub));
                }

                return `
                    <div class="space-y-5">
                        <div class="flex items-center justify-between gap-4 flex-wrap">
                            <div>
                                <h2 class="text-xl font-bold tracking-tight">Alerts</h2>
                                <p class="text-xs text-faint mt-0.5">Cảnh báo bảo mật ra Slack / Email / Webhook khi WAF block hoặc challenge</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="dashboard.alertsSave()" class="btn btn-primary">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                                    Save changes
                                </button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
                            <div class="md:col-span-3">${sidebar}</div>
                            <div class="md:col-span-9">${body}</div>
                        </div>
                    </div>
                `;
            }

            _htmlEsc(s) {
                return String(s||'').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
            }

            // Reusable placeholder reference shown under each template field.
            _alertsPlaceholderHint() {
                const tokens = ['{timestamp}', '{decision}', '{severity}', '{client_ip}', '{method}', '{host}', '{path}', '{reason}', '{rule_id}', '{score}', '{user_agent}', '{request_id}'];
                return `<div class="text-xs text-faint mt-1">Placeholders: ${tokens.map(t => `<code class="chip" style="font-size:10px; cursor:pointer" onclick="dashboard._alertsInsertPlaceholder(event, '${t}')">${t}</code>`).join(' ')}</div>`;
            }

            _alertsInsertPlaceholder(ev, token) {
                ev.preventDefault();
                const row = ev.target.closest('label, .form-row, div');
                if (!row) return;
                const ta = row.querySelector('textarea, input[type=text]');
                if (!ta) return;
                const start = ta.selectionStart || ta.value.length;
                const end   = ta.selectionEnd   || ta.value.length;
                ta.value = ta.value.slice(0, start) + token + ta.value.slice(end);
                ta.focus();
                ta.setSelectionRange(start + token.length, start + token.length);
                ta.dispatchEvent(new Event('change', {bubbles: true}));
            }

            _renderAlertsGeneral(c, stats) {
                return `
                    <div class="glass p-5 space-y-5">
                        <div class="flex items-center justify-between gap-4 flex-wrap">
                            <div>
                                <h3 class="text-base font-bold" style="margin:0">General</h3>
                                <p class="text-xs text-faint mt-0.5">Master switch + severity floor + dedup throttle áp dụng cho tất cả destination.</p>
                            </div>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" ${c.enabled ? 'checked' : ''} onchange="dashboard.alertsConfig.enabled=this.checked">
                                <span class="text-sm" style="color:var(--fg-1)">Enable alerts globally</span>
                            </label>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <label class="text-xs" style="color:var(--fg-2)">
                                Minimum severity
                                <select onchange="dashboard.alertsConfig.min_severity=this.value" class="pill-input mt-1 w-full">
                                    ${['INFO','LOW','MEDIUM','HIGH','CRITICAL'].map(s =>
                                        `<option value="${s}" ${c.min_severity===s?'selected':''}>${s}</option>`
                                    ).join('')}
                                </select>
                                <span class="text-xs text-faint">Events thấp hơn mức này bị drop</span>
                            </label>
                            <label class="text-xs" style="color:var(--fg-2)">
                                Throttle window (seconds)
                                <input type="number" value="${c.throttle_seconds||300}" min="0" onchange="dashboard.alertsConfig.throttle_seconds=parseInt(this.value)||300"
                                    class="pill-input mt-1 w-full" placeholder="300">
                                <span class="text-xs text-faint">Dedup theo (IP, rule_id). 0 = tắt throttle</span>
                            </label>
                            <div class="text-xs" style="color:var(--fg-2)">
                                Last sent
                                <div class="font-mono mt-1" style="color:var(--fg-0); font-size:12px">${stats.last_sent_at || '—'}</div>
                            </div>
                        </div>

                        <div class="rounded-lg p-4" style="background:var(--surface); border:1px solid var(--line)">
                            <div class="text-sm font-semibold mb-1" style="color:var(--fg-0)">Cách nó hoạt động</div>
                            <ul class="text-xs" style="color:var(--fg-2); line-height:1.7; padding-left:18px; list-style:disc">
                                <li>Mỗi request bị <b>BLOCK</b> hoặc <b>CHALLENGE</b> sẽ tạo 1 event.</li>
                                <li>Event được lọc theo <code>min_severity</code> rồi dedup trong cửa sổ <code>throttle_seconds</code>.</li>
                                <li>Event sống sót gửi <b>song song</b> tới mọi destination đang <b>enabled</b> trên tất cả 3 channel.</li>
                                <li>Send là <b>async</b> — không block hot path WAF. Timeout mỗi destination 5s.</li>
                            </ul>
                        </div>
                    </div>
                `;
            }

            // ------------------- LIST VIEW (destinations table) -------------------
            _renderAlertsList(channel, items) {
                const channelLabel = { slack: 'Slack', email: 'Email', webhook: 'Webhook' }[channel] || channel;
                const filter = (this.alertsFilter || '').toLowerCase();
                const filtered = filter
                    ? items.filter((d, i) => {
                        const hay = [d.id, d.name, d.webhook_url, d.url, d.host, (d.to||[]).join(',')].filter(Boolean).join(' ').toLowerCase();
                        return hay.includes(filter);
                      })
                    : items;

                const previewURL = (d) => {
                    if (channel === 'slack')   return d.webhook_url || '—';
                    if (channel === 'webhook') return d.url || '—';
                    if (channel === 'email')   return `${d.host||''}:${d.port||25} → ${(d.to||[]).join(', ') || '—'}`;
                    return '';
                };
                const tr = (d) => d.stats?.last_test_result || '';
                const trChip = (d) => {
                    const r = tr(d);
                    if (!r) return '<span class="text-faint">—</span>';
                    const isOK = r === 'OK';
                    return `<span class="chip" title="${this._htmlEsc(r)}" style="font-size:10px; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; ${isOK?'color:var(--good); border-color:var(--good)':'color:var(--bad); border-color:var(--bad)'}">${this._htmlEsc(r)}</span>`;
                };

                const rows = filtered.length === 0
                    ? `<tr><td colspan="6" style="text-align:center; color:var(--fg-3); padding:32px">${items.length === 0 ? `Chưa có destination ${channelLabel}. Click "+ Create" để thêm.` : 'Không có destination khớp filter.'}</td></tr>`
                    : filtered.map((d, idxRaw) => {
                        // Get the actual index in the full unfiltered array.
                        const i = items.indexOf(d);
                        return `
                            <tr onclick="dashboard.alertsEdit('${channel}', ${i})" style="cursor:pointer">
                                <td style="font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--accent); font-weight:600">${this._htmlEsc(d.id || '(new)')}</td>
                                <td style="font-weight:600; color:var(--fg-0)">${this._htmlEsc(d.name || '(unnamed)')}</td>
                                <td style="color:var(--fg-2); font-size:12px; max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap" title="${this._htmlEsc(previewURL(d))}">${this._htmlEsc(previewURL(d))}</td>
                                <td>${d.enabled
                                    ? '<span class="pill pill-allow" style="font-size:10px"><span class="pill-dot"></span>ON</span>'

                return `

                            💡 Click vào 1 dòng để mở editor — hoặc nút <b>Create</b> để thêm destination mới.
                        </div>
                    </div>
                `;
            }

            // ------------------- EDITOR HEADER (Back/Test/Enable) -------------------
            _renderAlertsEditorHeader(channel, dest) {

            // _alertsSetField — single source of truth for in-editor field updates.
            _alertsSetField(channel, key, value) {
                const e = this.alertsEditing;
                if (!e || e.channel !== channel) return;
                const arr = (channel === 'slack') ? this.alertsConfig.slack
                          : (channel === 'email') ? this.alertsConfig.email
                          : this.alertsConfig.webhook;
                if (!arr[e.index]) return;
                arr[e.index][key] = value;
            }

            _curDest(channel) {
                const e = this.alertsEditing;
                if (!e || e.channel !== channel) return null;
                const arr = (channel === 'slack') ? this.alertsConfig.slack
                          : (channel === 'email') ? this.alertsConfig.email
                          : this.alertsConfig.webhook;
                return arr[e.index] || null;
            }

            _renderAlertsWebhookEditor(d) {
                const headers = d.headers = d.headers || {};
                const headerKeys = Object.keys(headers);
                const headerRows = headerKeys.length === 0
                    ? `<div class="text-xs text-faint" style="padding:8px 0">Chưa có header nào. Click "+ Add header" để thêm.</div>`
                    : headerKeys.map((k, i) => `
                        <div class="flex items-center gap-2" data-hdr-row="${i}">
                            <input type="text" value="${this._htmlEsc(k)}" placeholder="header name"
                                onchange="dashboard.alertsRenameHeader('${this._htmlEsc(k)}', this.value)"
                                class="pill-input" style="flex:0 0 35%; font-family:'JetBrains Mono',monospace">
                            <input type="text" value="${this._htmlEsc(headers[k]||'')}" placeholder="header value"
                                onchange="dashboard.alertsSetHeaderValue('${this._htmlEsc(k)}', this.value)"
                                class="pill-input" style="flex:1; font-family:'JetBrains Mono',monospace">
                            <button onclick="dashboard.alertsRemoveHeader('${this._htmlEsc(k)}')" class="btn btn-sm" title="Xoá header này">✕</button>
                        </div>
                    `).join('');

                return `
                    <div class="glass p-5 space-y-4">
                        ${this._renderAlertsEditorHeader('webhook', d)}
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <label class="text-xs md:col-span-2" style="color:var(--fg-2)">
                                Name
                                <input type="text" value="${this._htmlEsc(d.name||'')}" onchange="dashboard._alertsSetField('webhook','name',this.value)"
                                    class="pill-input mt-1 w-full" placeholder="PagerDuty events">
                            </label>
                            <label class="text-xs md:col-span-1" style="color:var(--fg-2)">
                                Method
                                <select onchange="dashboard._alertsSetField('webhook','method',this.value)" class="pill-input mt-1 w-full">

                                </select>
                            </label>
                            <label class="text-xs md:col-span-4" style="color:var(--fg-2)">
                                URL
                                <input type="text" value="${this._htmlEsc(d.url||'')}" onchange="dashboard._alertsSetField('webhook','url',this.value)"

                        <div>
                            <div class="flex items-center justify-between gap-2 mb-2">
                                <label class="text-xs" style="color:var(--fg-2)">HTTP headers</label>
                                <button onclick="dashboard.alertsAddHeader()" class="btn btn-sm">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>

                        <div>
                            <label class="text-xs" style="color:var(--fg-2)">

                                    class="pill-input mt-1 w-full" rows="8"
                                    style="font-family:'JetBrains Mono',monospace; resize:vertical"
                                    placeholder='{&#10;  "event": "waf.{decision}",&#10;  "severity": "{severity}",&#10;  "summary": "{method} {host}{path} from {client_ip}",&#10;  "rule": "{rule_id}",&#10;  "reason": "{reason}",&#10;  "score": {score},&#10;  "ts": "{timestamp}"&#10;}'>${this._htmlEsc(d.payload_template||'')}</textarea>
                            </label>
                            ${this._alertsPlaceholderHint()}
                            <p class="text-xs text-faint mt-1">Template được render rồi gửi nguyên text. Nếu là JSON hợp lệ → <code>Content-Type: application/json</code>, ngược lại <code>text/plain</code>.</p>

            // ------------------- List/Editor actions -------------------
            alertsCreate(channel) {
                const blanks = {
                    slack:   { id: '', name: 'New Slack destination',   enabled: true, webhook_url: '', channel: '', username: 'WAF Sentinel', message_template: '' },
                    email:   { id: '', name: 'New email destination',   enabled: true, host: 'smtp.gmail.com', port: 587, username: '', password: '', from: '', to: [], use_tls: false, subject_template: '', body_template: '' },
                    webhook: { id: '', name: 'New webhook destination', enabled: true, url: '', method: 'POST', headers: {}, payload_template: '' },
                };
                const arr = (channel === 'slack') ? this.alertsConfig.slack
                          : (channel === 'email') ? this.alertsConfig.email
                          : this.alertsConfig.webhook;
                arr.push(blanks[channel]);
                this.alertsEditing = { channel, index: arr.length - 1, isNew: true };
                this.render();
            }

            alertsEdit(channel, index) {
                this.alertsEditing = { channel, index, isNew: false };
                this.render();
            }

            alertsBackToList() {
                this.alertsEditing = null;
                this.render();
            }

            alertsToggleEnabled(channel, index) {
                const arr = (channel === 'slack') ? this.alertsConfig.slack
                          : (channel === 'email') ? this.alertsConfig.email
                          : this.alertsConfig.webhook;
                if (!arr[index]) return;
                arr[index].enabled = !arr[index].enabled;
                this.render();
            }

            async alertsDelete(channel, index) {
                const arr = (channel === 'slack') ? this.alertsConfig.slack
                          : (channel === 'email') ? this.alertsConfig.email
                          : this.alertsConfig.webhook;
                const dest = arr[index];
                if (!dest) return;
                if (!confirm(`Xoá destination "${dest.name || dest.id || '(unnamed)'}"?\n\nĐổi này lưu khi bấm Save changes.`)) return;
                arr.splice(index, 1);
                // Reset editor if we were editing the deleted one.
                if (this.alertsEditing && this.alertsEditing.channel === channel && this.alertsEditing.index === index) {
                    this.alertsEditing = null;
                }
                this.render();
            }

            // ---- Webhook header helpers (operate on currently-edited destination) ----
            alertsAddHeader() {
                const d = this._curDest('webhook');
                if (!d) return;
                d.headers = d.headers || {};
                let name = 'X-Custom-Header';
                let i = 1;
                while (name in d.headers) { name = 'X-Custom-Header-' + (++i); }
                d.headers[name] = '';
                this.render();
            }
            alertsRemoveHeader(name) {
                const d = this._curDest('webhook');
                if (!d || !d.headers) return;
                delete d.headers[name];
                this.render();
            }
            alertsRenameHeader(oldName, newName) {
                newName = (newName || '').trim();
                if (!newName || newName === oldName) return;
                const d = this._curDest('webhook');
                if (!d || !d.headers) return;
                const val = d.headers[oldName];
                delete d.headers[oldName];
                d.headers[newName] = val;
                this.render();
            }
            alertsSetHeaderValue(name, val) {
                const d = this._curDest('webhook');
                if (!d || !d.headers) return;
                d.headers[name] = val;
            }

            // ---- Save / Test ----
            async alertsSave() {
                try {
                    const r = await authFetch(`${API_BASE}/alerts/config`, {
                        method: 'PUT',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify(this.alertsConfig || {})
                    });
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    const j = await r.json();
                    // Server-assigned IDs are echoed back — adopt the canonical config.
                    if (j.config) this.alertsConfig = j.config;
                    showToast('Alert config saved', 'success');
                    this.render();
                } catch (e) {
                    showToast('Save failed: ' + e.message, 'error');
                }
            }

            // Test a destination by index — used from the list table.
            async alertsTestDestination(channel, index) {
                const arr = (channel === 'slack') ? this.alertsConfig.slack
                          : (channel === 'email') ? this.alertsConfig.email
                          : this.alertsConfig.webhook;
                const d = arr[index];
                if (!d) return;
                await this._alertsTestSend(channel, d);
            }

            // Test the destination currently open in the editor.
            async alertsTestCurrent(channel) {
                const d = this._curDest(channel);
                if (!d) return;
                await this._alertsTestSend(channel, d);
            }

            async _alertsTestSend(channel, destination) {
                try {
                    const r = await authFetch(`${API_BASE}/alerts/test`, {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify({channel, destination})
                    });
                    const j = await r.json();
                    const result = j.result || 'unknown';
                    const ok = result === 'OK';
                    // Surface result on the destination itself so the table chip updates.
                    destination.stats = destination.stats || {};
                    destination.stats.last_test_result = result;
                    destination.stats.last_test_at = new Date().toISOString();
                    showToast(`Test ${channel}: ${result}`, ok ? 'success' : 'error');
                    // Refresh global stats too.
                    const sR = await authFetch(`${API_BASE}/alerts/stats`);
                    if (sR.ok) this.alertsStats = await sR.json();
                } catch (e) {
                    showToast('Test failed: ' + e.message, 'error');
                }
                this.render();
            }

            renderConfiguration() {
                const cfg = this.wafConfig;
                const block_t  = cfg ? cfg.decision.block_threshold     : 5.0;
                const chal_t   = cfg ? cfg.decision.challenge_threshold : 4.0;
                const rpm      = cfg ? cfg.rate_limit.requests_per_min  : 100;
                const burst    = cfg ? cfg.rate_limit.burst_size         : 20;
                const epLimits = (cfg && cfg.rate_limit.endpoint_limits) ? cfg.rate_limit.endpoint_limits : {};
                const epCount  = Object.keys(epLimits).length;
                const bypassCount = (this.bypassPaths || []).length;

                const sub = this.configSubTab || 'backend';

                const tabs = [
                    { id: 'backend',    label: 'Backend Server',  icon: 'M5 12h14M12 5l7 7-7 7',                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          meta: '' },
                    { id: 'detection',  label: 'Detection',       icon: 'M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z',                                                                                                                                                                                                  meta: `${block_t.toFixed(1)} / ${chal_t.toFixed(1)}` },
                    { id: 'ratelimit',  label: 'Rate Limiting',   icon: 'M13 10V3L4 14h7v7l9-11h-7z',                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       meta: `${rpm} rpm` },
                    { id: 'bypass',     label: 'Bypass Paths',    icon: 'M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9',                                                                                                                                                                                                                                                                                                                                meta: `${bypassCount}` }
                ];

                const sidebar = `
                    <aside class="glass p-2 self-start sticky top-24">
                        <div class="space-y-1">
                            ${tabs.map(t => `
                                <button class="side-tab ${sub === t.id ? 'active' : ''}" onclick="dashboard.switchConfigSubTab('${t.id}')">
                                    <span class="side-icon"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${t.icon}"/></svg></span>
                                    <span>${t.label}</span>
                                    ${t.meta ? `<span class="side-meta">${t.meta}</span>` : ''}
                                </button>
                            `).join('')}
                        </div>
                    </aside>
                `;

                let body = '';
                switch (sub) {
                    case 'detection': body = this._renderConfigDetection(block_t, chal_t); break;
                    case 'ratelimit': body = this._renderConfigRateLimit(rpm, burst, epLimits, epCount); break;
                    case 'bypass':    body = this._renderConfigBypass(); break;
                    case 'backend':
                    default:          body = this._renderConfigBackend(); break;
                }

                return `
                    <div class="space-y-5">
                        <div>
                            <h2 class="text-xl font-bold tracking-tight">Configuration</h2>
                            <p class="text-xs text-faint mt-0.5">All changes apply live — no restart required</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
                            <div class="md:col-span-3">${sidebar}</div>
                            <div class="md:col-span-9">${body}</div>
                        </div>
                    </div>
                `;
            }

            _renderConfigBackend() {
                const validBackend = this.backendURL && !['Loading...', 'Error loading', 'Unknown'].includes(this.backendURL);
                return `
                    <div class="glass p-6">
                        <div class="section-head">
                            <div class="section-icon"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/></svg></div>
                            <div>
                                <h3 class="text-base font-bold">Backend Server</h3>
                                <p class="text-xs text-faint">Upstream that the WAF protects</p>
                            </div>
                        </div>
                        <div class="rounded-lg p-4 mb-5 flex items-center justify-between" style="background: var(--surface); border: 1px solid var(--line);">
                            <div>
                                <div class="text-xs text-faint mb-1">Current backend</div>
                                <div class="font-mono text-sm font-semibold" style="color: var(--accent);">${this.backendURL}</div>
