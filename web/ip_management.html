<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAF IP Management - Quản Lý IP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card.danger .number {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-card.success .number {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .panel h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .add-ip-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .add-ip-form input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .add-ip-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.4);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 12px;
        }

        .ip-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .ip-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .ip-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .ip-item.blocked {
            border-left-color: #f5576c;
            background: #fff5f7;
        }

        .ip-item.whitelisted {
            border-left-color: #00f2fe;
            background: #f0fcff;
        }

        .ip-info {
            flex: 1;
        }

        .ip-address {
            font-weight: 600;
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
            font-family: 'Courier New', monospace;
        }

        .ip-meta {
            font-size: 12px;
            color: #666;
        }

        .ip-actions {
            display: flex;
            gap: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-danger {
            background: #ffebee;
            color: #c62828;
        }

        .badge-success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .badge-warning {
            background: #fff3e0;
            color: #e65100;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.success {
            border-left: 4px solid #4caf50;
        }

        .notification.error {
            border-left: 4px solid #f44336;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🛡️ WAF IP Management</h1>
            <p>Quản lý danh sách IP - Chặn và Gỡ chặn</p>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card danger">
                <h3>📛 Đang Bị Chặn</h3>
                <div class="number" id="stat-blocked">-</div>
            </div>
            <div class="stat-card success">
                <h3>✅ Whitelist</h3>
                <div class="number" id="stat-whitelist">-</div>
            </div>
            <div class="stat-card">
                <h3>🚫 Blacklist</h3>
                <div class="number" id="stat-blacklist">-</div>
            </div>
            <div class="stat-card">
                <h3>👁️ Đang Giám Sát</h3>
                <div class="number" id="stat-monitored">-</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Blocked IPs Panel -->
            <div class="panel">
                <h2>🚨 IPs Đang Bị Chặn</h2>
                <div id="blocked-ips-list" class="ip-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Đang tải...</p>
                    </div>
                </div>
            </div>

            <!-- Whitelist Panel -->
            <div class="panel">
                <h2>✅ Whitelist</h2>
                <div class="add-ip-form">
                    <input type="text" id="whitelist-ip" placeholder="IP Address (e.g., 192.168.1.1)">
                    <input type="text" id="whitelist-reason" placeholder="Lý do (optional)">
                    <button class="btn btn-success" onclick="addToWhitelist()">
                        ➕ Thêm
                    </button>
                </div>
                <div id="whitelist-ips" class="ip-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Đang tải...</p>
                    </div>
                </div>
            </div>

            <!-- Blacklist Panel -->
            <div class="panel">
                <h2>🚫 Blacklist</h2>
                <div class="add-ip-form">
                    <input type="text" id="blacklist-ip" placeholder="IP Address">
                    <input type="text" id="blacklist-reason" placeholder="Lý do">
                    <button class="btn btn-danger" onclick="addToBlacklist()">
                        ➕ Chặn
                    </button>
                </div>
                <div id="blacklist-ips" class="ip-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Đang tải...</p>
                    </div>
                </div>
            </div>

            <!-- Suspicious IPs Panel -->
            <div class="panel">
                <h2>⚠️ IPs Đáng Ngờ</h2>
                <div id="suspicious-ips" class="ip-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Đang tải...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script>
        const API_BASE = '';  // Same origin

        // Show notification
        function showNotification(message, type = 'success') {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.className = `notification ${type}`;
            notif.style.display = 'block';

            setTimeout(() => {
                notif.style.display = 'none';
            }, 3000);
        }

        // Format time
        function formatTime(timestamp) {
            if (!timestamp) return 'N/A';
            const date = new Date(timestamp);
            return date.toLocaleString('vi-VN');
        }

        // Format duration
        function formatDuration(blockedUntil) {
            if (!blockedUntil) return '';
            const now = new Date();
            const until = new Date(blockedUntil);
            const diff = until - now;

            if (diff <= 0) return 'Hết hạn';

            const minutes = Math.floor(diff / 60000);
            if (minutes < 60) return `${minutes} phút`;

            const hours = Math.floor(minutes / 60);
            return `${hours} giờ ${minutes % 60} phút`;
        }

        // Load blocked IPs
        async function loadBlockedIPs() {
            try {
                const response = await fetch('/api/ips/blocked');
                const data = await response.json();

                const container = document.getElementById('blocked-ips-list');

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <p>Không có IP nào bị chặn</p>
                        </div>
                    `;
                    document.getElementById('stat-blocked').textContent = '0';
                    return;
                }

                document.getElementById('stat-blocked').textContent = data.length;

                container.innerHTML = data.map(ip => `
                    <div class="ip-item blocked">
                        <div class="ip-info">
                            <div class="ip-address">${ip.ip}</div>
                            <div class="ip-meta">
                                <span class="badge badge-danger">Blocked</span>
                                ${ip.last_seen ? `
                                    <span class="badge badge-warning">Seen: ${formatTime(ip.last_seen)}</span>
                                ` : ''}
                            </div>
                        </div>
                        <div class="ip-actions">
                            <button class="btn btn-success btn-small" onclick="unblockIP('${ip.ip}')">
                                ✓ Gỡ Chặn
                            </button>
                            <button class="btn btn-primary btn-small" onclick="addToWhitelistDirect('${ip.ip}')">
                                + Whitelist
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading blocked IPs:', error);
                document.getElementById('blocked-ips-list').innerHTML =
                    '<div class="empty-state"><p>Lỗi khi tải dữ liệu</p></div>';
            }
        }

        // Load whitelist
        async function loadWhitelist() {
            try {
                const response = await fetch('/api/whitelist');
                const data = await response.json();
                const ips = data.ips || [];

                const container = document.getElementById('whitelist-ips');

                if (!ips || ips.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>Whitelist trống</p></div>';
                    document.getElementById('stat-whitelist').textContent = '0';
                    return;
                }

                document.getElementById('stat-whitelist').textContent = ips.length;

                container.innerHTML = ips.map(ip => `
                    <div class="ip-item whitelisted">
                        <div class="ip-info">
                            <div class="ip-address">${ip}</div>
                            <div class="ip-meta">
                                <span class="badge badge-success">Whitelisted</span>
                            </div>
                        </div>
                        <div class="ip-actions">
                            <button class="btn btn-danger btn-small" onclick="removeFromWhitelist('${ip}')">
                                ✗ Xóa
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading whitelist:', error);
                document.getElementById('whitelist-ips').innerHTML =
                    '<div class="empty-state"><p>Lỗi khi tải dữ liệu</p></div>';
            }
        }

        // Load blacklist
        async function loadBlacklist() {
            try {
                const response = await fetch('/api/blacklist');
                const data = await response.json();
                const ips = data.ips || [];

                const container = document.getElementById('blacklist-ips');

                if (!ips || ips.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>Blacklist trống</p></div>';
                    document.getElementById('stat-blacklist').textContent = '0';
                    return;
                }

                document.getElementById('stat-blacklist').textContent = ips.length;

                container.innerHTML = ips.map(ip => `
                    <div class="ip-item blocked">
                        <div class="ip-info">
                            <div class="ip-address">${ip}</div>
                            <div class="ip-meta">
                                <span class="badge badge-danger">Blacklisted</span>
                            </div>
                        </div>
                        <div class="ip-actions">
                            <button class="btn btn-success btn-small" onclick="removeFromBlacklist('${ip}')">
                                ✗ Gỡ
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading blacklist:', error);
                document.getElementById('blacklist-ips').innerHTML =
                    '<div class="empty-state"><p>Lỗi khi tải dữ liệu</p></div>';
            }
        }

        // Load suspicious IPs
        async function loadSuspiciousIPs() {
            try {
                const response = await fetch('/api/ips/suspicious');
                const data = await response.json();

                const container = document.getElementById('suspicious-ips');

                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>Không có IP đáng ngờ</p></div>';
                    document.getElementById('stat-monitored').textContent = '0';
                    return;
                }

                document.getElementById('stat-monitored').textContent = data.length;

                container.innerHTML = data.map(ip => `
                    <div class="ip-item">
                        <div class="ip-info">
                            <div class="ip-address">${ip.ip}</div>
                            <div class="ip-meta">
                                <span class="badge badge-warning">Suspicion: ${(ip.suspicion_score * 100).toFixed(0)}%</span>
                                ${ip.is_bot ? '<span class="badge badge-danger">BOT</span>' : ''}
                                <span class="badge badge-success">Requests: ${ip.total_requests}</span>
                            </div>
                        </div>
                        <div class="ip-actions">
                            <button class="btn btn-danger btn-small" onclick="addToBlacklistDirect('${ip.ip}', 'Suspicious activity')">
                                🚫 Chặn
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading suspicious IPs:', error);
                document.getElementById('suspicious-ips').innerHTML =
                    '<div class="empty-state"><p>Lỗi khi tải dữ liệu</p></div>';
            }
        }

        // Unblock IP
        async function unblockIP(ip) {
            if (!confirm(`Gỡ chặn IP: ${ip}?`)) return;

            try {
                const response = await fetch('/api/ips/unblock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: ip })
                });

                if (response.ok) {
                    showNotification(`✓ Đã gỡ chặn IP: ${ip}`, 'success');
                    loadBlockedIPs();
                } else {
                    const error = await response.text();
                    showNotification(`✗ Lỗi: ${error}`, 'error');
                }
            } catch (error) {
                showNotification(`✗ Lỗi: ${error.message}`, 'error');
            }
        }

        // Add to whitelist
        async function addToWhitelist() {
            const ip = document.getElementById('whitelist-ip').value.trim();
            const reason = document.getElementById('whitelist-reason').value.trim();

            if (!ip) {
                showNotification('Vui lòng nhập IP address', 'error');
                return;
            }

            await addToWhitelistDirect(ip, reason);
            document.getElementById('whitelist-ip').value = '';
            document.getElementById('whitelist-reason').value = '';
        }

        async function addToWhitelistDirect(ip, reason = '') {
            try {
                const response = await fetch('/api/whitelist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ip: ip,
                        reason: reason || 'Manually added',
                        duration: 86400  // 24 hours
                    })
                });

                if (response.ok) {
                    showNotification(`✓ Đã thêm ${ip} vào whitelist`, 'success');
                    loadWhitelist();
                    loadBlockedIPs();
                } else {
                    const error = await response.text();
                    showNotification(`✗ Lỗi: ${error}`, 'error');
                }
            } catch (error) {
                showNotification(`✗ Lỗi: ${error.message}`, 'error');
            }
        }

        // Remove from whitelist
        async function removeFromWhitelist(ip) {
            if (!confirm(`Xóa ${ip} khỏi whitelist?`)) return;

            try {
                const response = await fetch('/api/whitelist', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: ip })
                });

                if (response.ok) {
                    showNotification(`✓ Đã xóa ${ip} khỏi whitelist`, 'success');
                    loadWhitelist();
                } else {
                    const error = await response.text();
                    showNotification(`✗ Lỗi: ${error}`, 'error');
                }
            } catch (error) {
                showNotification(`✗ Lỗi: ${error.message}`, 'error');
            }
        }

        // Add to blacklist
        async function addToBlacklist() {
            const ip = document.getElementById('blacklist-ip').value.trim();
            const reason = document.getElementById('blacklist-reason').value.trim();

            if (!ip) {
                showNotification('Vui lòng nhập IP address', 'error');
                return;
            }

            if (!reason) {
                showNotification('Vui lòng nhập lý do', 'error');
                return;
            }

            await addToBlacklistDirect(ip, reason);
            document.getElementById('blacklist-ip').value = '';
            document.getElementById('blacklist-reason').value = '';
        }

        async function addToBlacklistDirect(ip, reason) {
            try {
                const response = await fetch('/api/blacklist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ip: ip,
                        reason: reason
                    })
                });

                if (response.ok) {
                    showNotification(`✓ Đã chặn IP: ${ip}`, 'success');
                    loadBlacklist();
                    loadSuspiciousIPs();
                } else {
                    const error = await response.text();
                    showNotification(`✗ Lỗi: ${error}`, 'error');
                }
            } catch (error) {
                showNotification(`✗ Lỗi: ${error.message}`, 'error');
            }
        }

        // Remove from blacklist
        async function removeFromBlacklist(ip) {
            if (!confirm(`Gỡ chặn ${ip} khỏi blacklist?`)) return;

            try {
                const response = await fetch('/api/blacklist', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: ip })
                });

                if (response.ok) {
                    showNotification(`✓ Đã gỡ ${ip} khỏi blacklist`, 'success');
                    loadBlacklist();
                } else {
                    const error = await response.text();
                    showNotification(`✗ Lỗi: ${error}`, 'error');
                }
            } catch (error) {
                showNotification(`✗ Lỗi: ${error.message}`, 'error');
            }
        }

        // Load all data
        function loadAllData() {
            loadBlockedIPs();
            loadWhitelist();
            loadBlacklist();
            loadSuspiciousIPs();
        }

        // Auto refresh every 30 seconds
        setInterval(loadAllData, 30000);

        // Initial load
        loadAllData();
    </script>
</body>

</html>
