<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — WAF Dashboard</title>
    <!--
        Apply the stored theme BEFORE first paint so the auth pages don't
        flash light/dark on reload. Matches the dashboard's own bootstrap
        in index.html.
    -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('waf_theme') || 'dark';
                document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
            } catch (_) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Theme tokens — kept identical to index.html so the look stays
           in lockstep with the dashboard. Edit there first, copy here. */
        :root, [data-theme="dark"] {
            --bg-0: #07080d;
            --bg-1: #0d1018;
            --line: rgba(148, 163, 184, 0.10);
            --line-strong: rgba(148, 163, 184, 0.18);
            --fg-0: #f1f5f9;
            --fg-1: #cbd5e1;
            --fg-2: #94a3b8;
            --fg-3: #64748b;
            --surface: rgba(255, 255, 255, 0.025);
            --surface-strong: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --accent: #22d3ee;
            --accent-2: #818cf8;
            --accent-fg: #082f49;
            --bg-radial-1: rgba(99, 102, 241, 0.12);
            --bg-radial-2: rgba(34, 211, 238, 0.10);
            --shadow-card: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 20px 60px -30px rgba(0, 0, 0, 0.6);
        }
        [data-theme="light"] {
            --bg-0: #f6f8fc;
            --bg-1: #ffffff;
            --line: rgba(15, 23, 42, 0.08);
            --line-strong: rgba(15, 23, 42, 0.14);
            --fg-0: #0f172a;
            --fg-1: #334155;
            --fg-2: #64748b;
            --fg-3: #94a3b8;
            --surface: rgba(15, 23, 42, 0.025);
            --surface-strong: rgba(15, 23, 42, 0.04);
            --surface-hover: rgba(15, 23, 42, 0.06);
            --accent: #0891b2;
            --accent-2: #6366f1;
            --accent-fg: #ffffff;
            --bg-radial-1: rgba(99, 102, 241, 0.08);
            --bg-radial-2: rgba(8, 145, 178, 0.06);
            --shadow-card: 0 1px 0 rgba(255, 255, 255, 0.7) inset, 0 12px 40px -20px rgba(15, 23, 42, 0.18);
        }

        html, body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body {
            background:
                radial-gradient(1200px 600px at 80% -10%, var(--bg-radial-1), transparent 60%),
                radial-gradient(900px 500px at -10% 10%, var(--bg-radial-2), transparent 55%),
                linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
            color: var(--fg-1);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: background-color .25s ease, color .25s ease;
        }

        .glass {
            background: linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface) 40%, transparent));
            border: 1px solid var(--line);
            border-radius: 16px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: var(--shadow-card);
        }

        .pill-input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--fg-0);
            font-size: 14px;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .pill-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            border: 0;
            color: var(--accent-fg);
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            transition: transform .12s ease, box-shadow .15s ease;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 30px -10px color-mix(in srgb, var(--accent) 45%, transparent); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }

        .theme-toggle {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--surface-strong);
            border: 1px solid var(--line-strong);
            color: var(--fg-1);
            cursor: pointer;
            transition: all .15s ease;
        }
        .theme-toggle:hover { background: var(--surface-hover); color: var(--accent); }

        .alert {
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            border-left: 3px solid;
        }
        .alert.show { display: block; }
        .alert-error   { background: color-mix(in srgb, #ef4444 10%, transparent); color: #fca5a5; border-color: #ef4444; }
        .alert-success { background: color-mix(in srgb, #22c55e 10%, transparent); color: #86efac; border-color: #22c55e; }
        [data-theme="light"] .alert-error   { color: #b91c1c; }
        [data-theme="light"] .alert-success { color: #15803d; }

        .loading { opacity: .6; pointer-events: none; }

        .form-label {
            display: block;
            margin-bottom: 6px;
            color: var(--fg-2);
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .footer-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>

<body>
    <div class="w-full max-w-md">
        <!-- Theme toggle in top-right of card area -->
        <div class="flex justify-end mb-3">
            <button id="themeToggleBtn" onclick="toggleTheme()" class="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle theme"></button>
        </div>

        <div class="glass p-8 sm:p-10">
            <!-- Logo / brand -->
            <div class="text-center mb-8">
                <div class="inline-flex w-12 h-12 rounded-xl items-center justify-center mb-3"
                     style="background: linear-gradient(135deg, var(--accent-2), var(--accent)); box-shadow: 0 12px 30px -10px color-mix(in srgb, var(--accent) 50%, transparent);">
                    <svg class="w-6 h-6" style="color: var(--accent-fg);" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 2L4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4"/>
                    </svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight" style="color: var(--fg-0);">WAF Console</h1>
                <p class="text-xs mt-1" style="color: var(--fg-2);">Sign in to your account</p>
            </div>

            <div id="errorMessage" class="alert alert-error"></div>
            <div id="successMessage" class="alert alert-success"></div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" class="pill-input">
                </div>

                <div>
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" class="pill-input">
                </div>

                <button type="submit" class="btn-primary mt-2">Sign in</button>
            </form>

            <p class="text-center text-xs mt-6 footer-link" style="color: var(--fg-2);">
                Don't have an account? <a href="/register.html">Register here</a>
            </p>
        </div>

        <p class="text-center text-[11px] mt-4" style="color: var(--fg-3);">
            Protected by WAF · Local-only by default · TLS recommended
        </p>
    </div>

    <script>
        // Theme toggle — same persistence key as the dashboard.
        function themeIcon() {
            const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
            return isDark
                ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.36 6.36l-.71-.71M6.34 6.34l-.71-.71m12.02 0l-.71.71M6.34 17.66l-.71.71M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`
                : `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>`;
        }
        function toggleTheme() {
            const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
            const next = cur === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('waf_theme', next); } catch (_) {}
            document.getElementById('themeToggleBtn').innerHTML = themeIcon();
        }
        document.getElementById('themeToggleBtn').innerHTML = themeIcon();

        // Login flow — preserved verbatim from the previous version, only
        // the surrounding theme changed.
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        function showAlert(el, msg) { el.textContent = msg; el.classList.add('show'); }
        function hideAlerts() {
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            hideAlerts();
            loginForm.classList.add('loading');

            try {
                const response = await fetch('/waf-api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await response.json();

                if (response.ok && data.token) {
                    localStorage.setItem('waf_token', data.token);
                    localStorage.setItem('waf_user', JSON.stringify(data.user));
                    showAlert(successMessage, 'Signed in. Redirecting…');
                    setTimeout(() => { window.location.href = nextTarget(); }, 600);
                } else {
                    showAlert(errorMessage, data.error || 'Login failed. Check your credentials.');
                }
            } catch (err) {
                showAlert(errorMessage, 'Network error. Please try again.');
            } finally {
                loginForm.classList.remove('loading');
            }
        });

        function nextTarget() {
            const q = new URLSearchParams(window.location.search);
            const next = q.get('next');
            // Same-origin paths only — blocks open-redirect via ?next=//evil.com
            if (next && next.startsWith('/') && !next.startsWith('//')) return next;
            return '/dashboard/';
        }

        function showReason() {
            const q = new URLSearchParams(window.location.search);
            const reason = q.get('reason');
            if (reason) {
                showAlert(errorMessage, reason === 'session expired'
                    ? 'Your session has expired — please sign in again.'
                    : reason);
            }
        }

        // If a valid token is still around, skip the form.
        window.addEventListener('DOMContentLoaded', async () => {
            showReason();
            const token = localStorage.getItem('waf_token');
            if (!token) return;
            try {
                const r = await fetch('/waf-api/auth/me', { headers: { Authorization: 'Bearer ' + token } });
                if (r.ok) {
                    window.location.href = nextTarget();
                } else {
                    localStorage.removeItem('waf_token');
                    localStorage.removeItem('waf_user');
                }
            } catch (_) { /* network failure → stay */ }
        });
    </script>
</body>

</html>
